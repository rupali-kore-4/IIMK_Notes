{s:'Day 5 · Absorption vs variable costing example',q:`The company made 4,000 units and sold 3,800 (inventory 200 units). Variable cost per unit $10 (DM + DL + variable MOH). Fixed MOH $50,000. Sales $190,000. Variable operating expenses $19,000; fixed operating expenses $80,000. Prepare the income statement under absorption costing and under variable costing.`,
st:[`<b>Unit cost.</b> Fixed MOH per unit = 50,000 / 4,000 = 12.50. <b>Absorption unit cost = 10 + 12.50 = 22.50.</b> Variable costing unit cost = <b>10</b>.`,`<b>Closing FG.</b> Absorption 200 × 22.50 = <b>4,500</b>. Variable 200 × 10 = <b>2,000</b>.`,`<b>Absorption statement.</b> Sales 190,000 − COGS (3,800 × 22.50 = 85,500) = GM 104,500. Less operating expenses 19,000 + 80,000 = 99,000. <b>Operating income 5,500</b>.`,`<b>Variable statement.</b> Variable expenses = 3,800 × 10 = 38,000 + 19,000 = 57,000. CM = 190,000 − 57,000 = 133,000. Less fixed 50,000 + 80,000 = 130,000. <b>Operating income 3,000</b>.`,`<b>Difference</b> = 5,500 − 3,000 = 2,500 = 200 units × 12.50 (change in inventory × fixed MOH per unit).`],
a:'Absorption OI 5,500 · Variable OI 3,000 · Difference 2,500'},
{s:'Day 5 · Contribution format vs traditional format ($000)',q:`Revenue 1,000; variable manufacturing costs 250; variable non-manufacturing costs 270; fixed manufacturing 160; fixed non-manufacturing 138. Prepare both formats.`,
st:[`<b>Contribution:</b> 1,000 − (250 + 270) = <b>480</b>. Less fixed 160 + 138 = 298. <b>Operating income 182</b>.`,`<b>Traditional:</b> COGS = 250 + 160 = 410. Gross margin = <b>590</b>. Less non-manufacturing 270 + 138 = 408. <b>Operating income 182</b>.`],
a:'Contribution margin 480 · Gross margin 590 · Operating income 182'},
{s:'Day 5 · Marginal cost example',q:`Direct material Rs 40,000; direct labour Rs 20,000; variable OH Rs 20,000; fixed OH Rs 20,000; production 10,000 units. Find the marginal cost.`,
st:[`Prime cost = 40,000 + 20,000 = 60,000.`,`<b>Marginal cost = prime cost + variable OH</b> = 60,000 + 20,000 = <b>80,000</b>.`,`Per unit = 80,000 / 10,000 = <b>Rs 8.00</b>. The fixed OH of 20,000 is left out.`],
a:'Marginal cost Rs 80,000 (Rs 8.00 a unit)'}
];
PROB.P13=[
{s:'Day 5 · Racing Bicycle Company (RBC): base case',q:`RBC sells bikes at $500. Variable cost is $300 per bike. Fixed expenses are $80,000 per month. Find CM per unit, CM ratio, break-even in units and dollars. How many bikes must be sold to earn a profit of $100,000?`,
st:[`<b>CM per unit</b> = 500 − 300 = <b>200</b>. <b>CM ratio</b> = 200/500 = <b>40%</b>.`,`<b>Break-even units</b> = FC / CM per unit = 80,000/200 = <b>400</b>. <b>Break-even sales</b> = FC / CM ratio = 80,000/0.40 = <b>$200,000</b>.`,`<b>Target profit units</b> = (FC + TP)/CM per unit = (80,000 + 100,000)/200 = <b>900 bikes</b>. Dollars = 180,000/0.40 = <b>$450,000</b>.`,`<b>Shortcut above break-even:</b> income = (units − BE units) × CM per unit. At 430 bikes: 30 × 200 = 6,000.`],
a:'CM 200 · 40% · BE 400 bikes / $200,000 · Target $100,000: 900 bikes / $450,000'},
{s:'Day 5 · Emma',q:`Emma has fixed costs of $2,000 and a contribution margin percentage of 40%. If Emma wants to make a profit of $2,000, what must revenue equal? What if Emma wants to make a profit of $3,000, what must revenue equal?`,
st:[`Formula: (Fixed Cost + Target Operating Income) / Contribution Margin %.`,`Profit 2,000: (2,000 + 2,000)/0.40 = <b>$10,000</b>.`,`Profit 3,000: (2,000 + 3,000)/0.40 = <b>$12,500</b>.`],a:'$10,000 and $12,500'},
{s:'Day 5 · Tee Times (golf clubs, with tax)',q:`Tee Times, Inc. produces and sells the finest quality golf clubs in all of Clay County. The company expects the following revenues and costs in 2004 for its Elite Quality golf club sets:
Revenues (400 sets sold @ 600 per set) 240,000 | Variable costs 160,000 | Fixed costs 50,000
9. How many sets of clubs must be sold for Tee Times, Inc. to reach their breakeven point? a. 400 b. 250 c. 200 d. 150
11. What amount of sales must Tee Times, Inc. have to earn a target net income of 63,000 if they have a tax rate of 30 percent? a. 489,000 b. 429,000 c. 420,000 d. 300,000`,
st:[`<b>CM per set</b> = 600 − 160,000/400 (= 400) = <b>200</b>.`,`<b>Q9 break-even</b> = 50,000/200 = <b>250 sets</b> (b).`,`<b>Q11. Net to operating income:</b> operating income = net income / (1 − tax rate) = 63,000 / 0.70 = <b>90,000</b>. The CVP equation always uses operating (pre-tax) income.`,`<b>Units</b> = (50,000 + 90,000)/200 = 700 sets. <b>Sales</b> = 700 × 600 = <b>$420,000</b> (c).`],
a:'Q9: 250 sets (b) · Q11: $420,000 (c)'},
{s:'Day 5 · Coffee Klatch questions (CP 1–4, 8, 14–16)',q:`Coffee Klatch is an espresso stand in a downtown office building. The average selling price of a cup of coffee is $1.49 and the average variable expense per cup is $0.36. The average fixed expense per month is $1,300. An average of 2,100 cups are sold each month.
(a) Use the formula method to determine how many cups would have to be sold to attain target profits of $2,500 per month. [a. 3,363 b. 2,212 c. 1,150 d. 4,200]
(b) Sales dollars needed for target profit of $2,500. [a. $2,550 b. $5,013 c. $8,458 d. $10,555]
(c) What is the break-even sales in units? [a. 872 b. 3,611 c. 1,200 d. 1,150 cups]
(d) What is the break-even sales dollars? [a. $1,300 b. $1,715 c. $1,788 d. $3,129]
(e) What is the CM Ratio? [a. 1.319 b. 0.758 c. 0.242 d. 4.139]
(f) Margin of safety in cups; operating leverage; and by what % income rises if sales rise 20%.`,
st:[`<b>CM per cup</b> = 1.49 − 0.36 = <b>1.13</b>. <b>CM ratio</b> = 1.13/1.49 = <b>0.758</b> (b).`,`<b>(a) Units</b> = (2,500 + 1,300)/1.13 = <b>3,363</b> (a).`,`<b>(b) Dollars</b> = 3,800/0.758 = <b>$5,013</b> (b).`,`<b>(c) Break-even units</b> = 1,300/1.13 = <b>1,150</b> (d).`,`<b>(d) Break-even dollars</b> = 1,150 × 1.49 = 1,300/0.758 ≈ <b>$1,715</b> (b).`,`<b>(f) MOS</b> = 2,100 − 1,150 = <b>950 cups</b>. <b>OL</b> = CM / income = (2,100 × 1.13 = 2,373) / (2,373 − 1,300 = 1,073) = <b>2.21</b>. <b>Income rises</b> = 2.21 × 20% = <b>44.2%</b>.`,`Units use CM <b>per unit</b>. Dollars use the CM <b>ratio</b>.`],
a:'3,363 cups · $5,013 · 1,150 cups · $1,715 · 0.758 · MOS 950 · OL 2.21 · 44.2%'},
{s:'Day 5 · Margin of safety and operating leverage (RBC)',q:`Let's look at Racing Bicycle Company and determine the margin of safety. Actual sales are $250,000 (500 bikes) and break-even sales are $200,000. Then find the degree of operating leverage and the effect of a 10% rise in sales.`,
st:[`<b>MOS</b> = budgeted sales − break-even sales = 250,000 − 200,000 = <b>$50,000</b>.`,`<b>MOS ratio</b> = 50,000/250,000 = <b>20%</b>. In bikes: 50,000/500 = <b>100 bikes</b>.`,`<b>OL</b> = CM / operating income. CM = 500 × 200 = 100,000. Income = 100,000 − 80,000 = 20,000. OL = <b>5</b>.`,`<b>% change in income</b> = OL × % change in sales = 5 × 10% = <b>50%</b>. Check: 550 bikes × 200 = 110,000 − 80,000 = 30,000 (up 50%).`],
a:'MOS $50,000 (20%, 100 bikes) · OL 5 · income +50%'}
];
PROB.P14=[
{s:'Day 5 · Savor the Flavor (multi-product break-even)',q:`Savor the Flavor has a small, no-frills ice cream cart by the beach.
Strawberry cones sell for $3.00 each, have a variable cost of $0.50, and represent 25% of the 10,000 total units sold.
Lemon popsicles sell for $1.50 each, have a variable cost of $0.25, and represent 15% of total sales.
Ice cream sandwiches sell for $2.00 each, have a variable cost of $0.80, and represent 60% of total sales.
Fixed costs of the cart total $5,000 for the season.
Let's solve for the company's break-even point in units.`,
st:[`<b>Step 1. CM per unit:</b> cone 3.00 − 0.50 = 2.50; popsicle 1.50 − 0.25 = 1.25; sandwich 2.00 − 0.80 = 1.20.`,`<b>Step 2. WACM</b> = 0.25 × 2.50 + 0.15 × 1.25 + 0.60 × 1.20 = 0.625 + 0.1875 + 0.72 = <b>$1.5325</b>.`,`<b>Step 3. Break-even units</b> = FC / WACM = 5,000 / 1.5325 = <b>3,263</b>.`,`<b>Step 4. Split by mix:</b> cone 25% = 816; popsicle 15% = 489; sandwich 60% = 1,958.`,`The slide prints 3,247 (812 / 487 / 1,948), which is 5,000 over a rounded WACM of about 1.54. Quote the slide's figure if your professor does.`],
a:'WACM $1.5325 · Break-even 3,263 units (slide: 3,247)'},
{s:'Day 6 · Example 5 (change in sales mix)',q:`Eg 5: Products M, N, O and P. Fixed costs Rs 29,400.
Product (M, N, O, P, Total):
Sales (in Rs.): 40,000, 50,000, 20,000, 10,000, 1,20,000
Variable cost (in Rs.): 24,000, 34,000, 16,000, 4,000, 78,000
Contribution: 16,000, 16,000, 4,000, 6,000, 42,000
Contribution/sales: 0.4, 0.32, 0.2, 0.6
Fixed costs 29,400 | Profit 12,600
New product mix: sales 30,000, 44,000, 40,000, 6,000 (total 1,20,000). Find the profit under the new mix.`,
st:[`<b>Step 1. Contribution ratio</b> (P/V) per product: 0.40, 0.32, 0.20, 0.60.`,`<b>Step 2. New contribution = new sales × ratio:</b> M 30,000 × 0.40 = 12,000; N 44,000 × 0.32 = 14,080; O 40,000 × 0.20 = 8,000; P 6,000 × 0.60 = 3,600. Total <b>37,680</b>.`,`<b>Step 3.</b> Profit = 37,680 − 29,400 = <b>8,280</b> (old mix 12,600).`,`Profit falls by 4,320 because sales moved toward O (low ratio) and away from M and P. Shift the mix toward high-ratio products to raise profit.`],
a:'New profit Rs 8,280 (down Rs 4,320)'}
];
PROB.P15=[
{s:'Day 5 · RBC what-if cases 1 to 4',q:`Base case: 500 bikes, price $500, variable $300, fixed $80,000.
1. What is the profit impact if Racing Bicycle can increase unit sales from 500 to 540 by increasing the monthly advertising budget by $10,000?
2. What is the profit impact if Racing Bicycle can use higher quality raw materials, thus increasing variable costs per unit by $10, to generate an increase in unit sales from 500 to 580?
3. Price drops $20 (to $480), advertising rises $15,000 and sales rise from 500 to 650.
4. A $15 commission per bike replaces $6,000 of flat salaries; sales rise from 500 to 575.`,
st:[`<b>Base income</b> = 500 × 200 − 80,000 = <b>20,000</b>. Use incremental analysis: only the change in CM and the change in fixed cost.`,`<b>Case 1.</b> Extra CM = 40 × 200 = 8,000. Extra fixed 10,000. Change = <b>−2,000</b>.`,`<b>Case 2.</b> CM per unit = 190. 580 × 190 = 110,200 − 80,000 = 30,200. Change = <b>+10,200</b>.`,`<b>Case 3.</b> CM per unit 180. 650 × 180 = 117,000 − (80,000 + 15,000) = 22,000. Change = <b>+2,000</b>.`,`<b>Case 4.</b> CM per unit 185. 575 × 185 = 106,375 − (80,000 − 6,000) = 32,375. Change = <b>+12,375</b>.`],
a:'Case 1 −$2,000 · Case 2 +$10,200 · Case 3 +$2,000 · Case 4 +$12,375'},
{s:'Day 5 · RBC what-if case 5 (special order)',q:`If RBC has an opportunity to sell 150 bikes to a wholesaler without disturbing sales to other customers or fixed expenses, what price would it quote to the wholesaler if it wants to increase monthly profits by $3,000?`,
st:[`Fixed costs do not change, so the order only needs to cover variable cost plus the extra profit wanted.`,`<b>Price</b> = variable cost + extra profit per unit = 300 + 3,000/150 = 300 + 20 = <b>$320</b>.`],a:'Quote $320 per bike'}
];
PROB.P16=[
{s:'Day 5 · Example 1 (Modern Engineering: minimum price in a recession)',q:`Eg 1 In the face of the trade recession, M/s Modern Engineering Ltd., is having a difficult period due to lack of government orders and is operating below 60 per cent of its normal capacity. This is, however, considered to be a temporary phase and the management has taken a decision not to retrench labour. An enquiry has been received for 10,000 units of a product which could be manufactured by the company under the existing capacity, and the cost data is as follows:
Direct labour Re. 1 per hour | Time required 1 hour per unit | Direct material Rs. 2 per unit | Variable O.H. 400 per cent of direct labour | Fixed O.H. 600 per cent of direct labour | Cost of special tools Rs. 25,000
What is the minimum price you would recommend?`,
st:[`<b>Idle capacity, so fixed cost is not relevant.</b> Take only variable cost and any new cost caused by the order.`,`DM 2.00. DL 1 hour × Re 1 = 1.00. Variable OH 400% × 1 = 4.00.`,`Special tools are new: 25,000 / 10,000 = 2.50.`,`<b>Minimum price</b> = 2.00 + 1.00 + 4.00 + 2.50 = <b>Rs 9.50</b> per unit.`],a:'Rs 9.50 per unit'},
{s:'Day 5 · Example 2 (umbrella maker)',q:`Eg 2 An umbrella manufacturer makes an average net profit of Rs. 2.50 per piece in a selling price of Rs. 14.30 by producing and selling 60,000 pieces or 60% of the potential capacity. His cost of sales is:
Direct material Rs. 3.50 | Direct wages Rs. 1.25 | Works overheads Rs. 6.25 (50% fixed) | Sales overheads Re. 0.80 (25% varying)
During the current year he intends to produce the same number but anticipates that his fixed charge will go up by 10% while the rates of direct labour and direct material will increase by 8% and 6% respectively. But he has no option of increasing the selling price (because of recession). Under this situation, he obtains an offer for a further 20% of his capacity. What minimum price you will recommend for acceptance to ensure the manufacturer an overall profit of Rs. 1.673 lakhs?`,
st:[`<b>Today's variable cost:</b> DM 3.50 + wages 1.25 + works OH variable 3.125 (50% × 6.25) + sales OH variable 0.20 (25% × 0.80) = <b>8.075</b>.`,`<b>Fixed cost per piece today</b> = 14.30 − 8.075 − 2.50 profit = 3.725. Total fixed = 60,000 × 3.725 = <b>2,23,500</b>.`,`<b>New situation.</b> DM 3.50 × 1.06 = 3.71. Wages 1.25 × 1.08 = 1.35. Variable cost = 3.71 + 1.35 + 3.125 + 0.20 = <b>8.385</b>. Fixed = 2,23,500 × 1.10 = <b>2,45,850</b>.`,`<b>Contribution needed</b> = fixed 2,45,850 + profit 1,67,300 = 4,13,150.`,`<b>From the 60,000 pieces</b> at Rs 14.30: (14.30 − 8.385) × 60,000 = 5.915 × 60,000 = 3,54,900.`,`<b>Balance from 20,000 pieces</b> = 4,13,150 − 3,54,900 = 58,250 = Rs 2.9125 a piece.`,`<b>Minimum price</b> = 8.385 + 2.9125 = <b>Rs 11.2975</b>. (The slide prints 2.9215 by a typing slip.)`],a:'Rs 11.2975 per piece'},
{s:'Day 5 · Example 3 (AB Ltd, scarce labour)',q:`Eg 3 AB Ltd. makes a single product which sells for $ 20. There is great demand for this product. The unit variable cost of $12 shows the following details: Direct materials 4 | Direct labour (2 hours) 6 | Variable overheads 2 | Total 12
The labour force is currently working at full capacity and no extra time can be made available. A customer has approached AB Ltd. with a request for the manufacture of a special order, for which he is willing to pay $5,500. The costs of the order would be $ 2,000 for direct materials and 500 labour hours will be required. Should the order be accepted?`,
st:[`<b>Contribution per unit</b> = 20 − 12 = 8. <b>Per labour hour</b> = 8 / 2 hours = <b>$4</b>.`,`<b>Cost of the order:</b> DM 2,000 + DL 500 × 3 = 1,500 + variable OH 500 = <b>4,000</b>.`,`<b>Opportunity cost</b> (labour is full): 500 hours × 4 = <b>2,000</b> of contribution lost.`,`<b>Total cost</b> = 4,000 + 2,000 = 6,000. Price offered 5,500. <b>Loss 500, so do not accept.</b>`,`If labour were spare, opportunity cost would be nil and the order would add 1,500.`],a:'Reject: loss of $500 (cost incl. opportunity cost $6,000 vs price $5,500)'},
{s:'Day 6 · Example 4 (overseas contract vs local advertising)',q:`Eg 4 A company is working at 60% of potential capacity. The Sales Manager has reported two available solutions for increasing sales:
(a) By an overseas contract which calls for delivery, spread equally for a period of three years totaling Rs.15,00,000
(b) Local sales can be increased by 50 per cent if Rs.50,000 is spent on special advertising.
The following is a summarised analysis of the profit and loss account for the previous year (Rs. lakhs): Materials used 4.50 | Direct labour 5.10 | Manufacturing expenses: Fixed 1.75, Variable 0.75 | Selling expenses: Variable 1.50 | Administration expenses: Fixed 1.00 | Total 14.60 | Profit 0.40 | Sales 15.00
It is estimated that additional selling expenses on export sales will be 5 per cent of sales value. Decide whether the directors would adopt (a) or (b) or a feasible combination of (a) and (b).`,
st:[`<b>Step 1. Classify.</b> Fixed = 1.75 + 1.00 = <b>2.75</b>. The rest vary with sales.`,`<b>(a) Overseas, 5.00 a year.</b> Materials 4.50 × 5/15 = 1.50. Labour 1.70. Variable manufacturing 0.25. Variable selling 0.50. Additional selling 5% × 5.00 = 0.25. Variable cost 4.20. <b>Contribution = 5.00 − 4.20 = 0.80.</b> Total profit = 0.40 + 0.80 = <b>1.20</b>.`,`<b>(b) Local +50% = 22.50.</b> Materials 6.75 + labour 7.65 + manufacturing 1.125 + selling 2.25 = 17.775. Contribution = 4.725 (21%). Fixed 2.75 + 0.50 advertising = 3.25. <b>Profit 1.475.</b>`,`<b>Combination.</b> Capacity: 15.00 is 60%, so full is 25.00. Export 5.00 + domestic 20.00 = 25.00. Contribution 0.80 + 20.00 × 21% (4.20) = 5.00. Fixed 3.25. <b>Profit 1.75.</b>`,`<b>Decision:</b> adopt the combination (1.75 vs 1.20 and 1.475).`],a:'(a) 1.20 · (b) 1.475 · Combination 1.75 lakh → adopt the combination'}
];

{s:'Day 6 · Breakers, Inc. master budget (worked example)',q:`Breakers, Inc. is preparing budgets for the quarter ending June 30. Budgeted sales for the next five months are: April 20,000 units | May 50,000 | June 30,000 | July 25,000 | August 15,000. The selling price is $10 per unit.
Production: management wants ending inventory to be equal to 20% of the following month's budgeted sales in units. On March 31, 4,000 units were on hand.
Materials: five Kg of material are required per unit. Materials on hand at the end of each month equal to 10% of the following month's production. On March 31, 13,000 kg are on hand. Material cost $.40 per kg.
Direct labor: each unit requires 0.1 hours. "No layoff" policy: workforce is paid a minimum of 3,000 hours per month at $8 per hour (no overtime).
Selling and administrative: variable $0.50 per unit sold; fixed $70,000 per month including $10,000 depreciation.
Collections (all sales on account): 70% in the month of sale, 25% in the month following, 5% uncollected. March 31 receivables $30,000 collected in full.
Materials are paid 50% in the month of purchase and 50% the month after; March 31 payables $12,000.
Cash: opening $40,000; minimum $30,000; credit line at 12% to $75,000, borrow and repay at month end; dividend $25,000 in April; equipment $143,700 in May and $48,300 in June.
Prepare the sales, production, direct material, direct labor, cash receipts, cash disbursement and cash budgets, and the budgeted income statement.`,
st:[`<b>Order:</b> sales → production → direct material, direct labor, overhead, S&amp;A → collections and payments → cash budget → COGM and COGS → income statement.`,`<b>Sales.</b> April 200,000; May 500,000; June 300,000; quarter 1,000,000.`,`<b>Production units = sales + desired ending − beginning.</b>`+tb([['','Apr','May','Jun'],['Sales','20,000','50,000','30,000'],['+ Ending (20% next)','10,000','6,000','5,000'],['− Beginning','4,000','10,000','6,000'],['<b>Produce</b>','<b>26,000</b>','<b>46,000</b>','<b>29,000</b>']]),
`<b>Direct materials (kg) = needs + desired ending − beginning.</b>`+tb([['','Apr','May','Jun'],['Needs (5 × units)','130,000','230,000','145,000'],['+ Ending (10% next month)','23,000','14,500','11,500'],['− Beginning','13,000','23,000','14,500'],['<b>Purchase kg</b>','<b>140,000</b>','<b>221,500</b>','<b>142,000</b>'],['Cost at 0.40','56,000','88,600','56,800']]),
`<b>Direct labor.</b> Hours paid = the greater of hours required and 3,000. Apr 2,600 → 3,000 h = 24,000. May 4,600 h = 36,800. Jun 2,900 → 3,000 h = 24,000.`,
`<b>Cash receipts.</b> Apr 30,000 + 70% × 200,000 = <b>170,000</b>. May 25% × 200,000 + 70% × 500,000 = <b>400,000</b>. Jun 25% × 500,000 + 70% × 300,000 = <b>335,000</b>.`,
`<b>Cash for materials (50/50).</b> Apr 12,000 + 28,000 = <b>40,000</b>. May 28,000 + 44,300 = <b>72,300</b>. Jun 44,300 + 28,400 = <b>72,700</b>.`,
`<b>Cash disbursements besides materials:</b> labor 24,000 / 36,800 / 24,000; overhead 56,000 / 76,000 / 59,000; S&amp;A cash (total − 10,000 depreciation) 70,000 / 85,000 / 75,000.`,
`<b>Cash budget.</b>`+tb([['','Apr','May','Jun'],['Beginning cash','40,000','30,000','30,000'],['+ Collections','170,000','400,000','335,000'],['− Disbursements (incl. equipment, dividend)','215,000','413,800','279,000'],['Excess / (deficiency)','(5,000)','16,200','86,000'],['Borrow / (repay)','35,000','13,800','(48,800)'],['Interest','','','(838)'],['<b>Ending cash</b>','<b>30,000</b>','<b>30,000</b>','<b>36,362</b>']]),
`<b>Interest at 12%:</b> 35,000 × 12% × 2/12 = 700; 13,800 × 12% × 1/12 = 138. Total <b>838</b>.`,
`<b>COGM and COGS.</b> Unit cost 119,600 / 26,000 = 4.60. COGM quarter = <b>464,600</b>. COGS = 18,400 + 464,600 − 23,000 = <b>460,000</b> (100,000 × 4.60).`,
`<b>Income statement.</b> Revenue 1,000,000 − COGS 460,000 = GM 540,000. Less S&amp;A 260,000 and interest 838. <b>Net income = 279,162.</b>`],
a:'Production 26,000 / 46,000 / 29,000 · Purchases 140,000 / 221,500 / 142,000 kg · Ending cash 30,000 / 30,000 / 36,362 · Net income 279,162'},
{s:'Day 6 · Practice problems 1 to 9 (production, purchases, collections, cash)',q:`(Slide images; wording condensed to the data on each slide.)
1. Bison: purchases in August (sales 1,950; ending inventory 300; July ending inventory 210).
2. Swansong: purchases for the quarter to Sept 30 (sales 10,000, 11,000, 12,100; ending 950; opening 1,100).
3. Coleman: July production (sales 50,000; ending inventory 40% of next month's sales 48,000; beginning 40% of 50,000).
4. Tidewater: raw material purchases (units to make 85,000 + 17,000 − 11,000; 3 kg a unit; 20,000 ending, 29,000 beginning).
5. Northcutt: July direct labour (deluxe 1,000 units × 2.25 h; standard 5,000 × 2 h; $15 an hour).
6. Quattro: June collections (30% in the month of sale, 60% next, 10% the month after; sales 70,000, 80,000, 60,000).
7. Verna: receivables at Dec 31 (80% collected in the month, 10% the next; sales 50,000 and 60,000).
8. Phineus: July cash disbursements (operating expenses 180,000 incl. depreciation 60,000; June purchases 220,000; earlier 50,000; 40% of 560,000).
9. Wolverine: change in cash in February.`,
st:[`<b>Production / purchases = sales (or needs) + desired ending − beginning.</b>`,`<b>1.</b> 1,950 + 300 − 210 = <b>2,040</b> (C).`,`<b>2.</b> Sales 33,100 + 950 − 1,100 = <b>32,950</b> (C).`,`<b>3.</b> 50,000 + 19,200 − 20,000 = <b>49,200</b> (B).`,`<b>4.</b> Units 91,000 × 3 = 273,000 kg; + 20,000 − 29,000 = <b>264,000</b> (C).`,`<b>5.</b> 1,000 × 2.25 = 2,250 h + 5,000 × 2 = 10,000 h = 12,250 h × 15 = <b>$183,750</b> (A).`,`<b>6. Collections</b> = sum of % of each month's sales: 30% × 70,000 + 60% × 80,000 + 10% × 60,000 = 21,000 + 48,000 + 6,000 = <b>$75,000</b> (D).`,`<b>7.</b> 80% × 50,000 + 10% × 60,000 = 40,000 + 6,000 = <b>$46,000</b> (B).`,`<b>8.</b> Cash items only (depreciation is non-cash): 120,000 + 220,000 + 50,000 + 224,000 = <b>$674,000</b> (C).`,`<b>9.</b> Collections 43,000 − purchases 32,000 − cash expenses 6,500 = <b>+$4,500</b> (B).`],

{s:'Day 6 · Cheese Company (static vs flexible budget)',q:`Static budget at 10,000 machine hours: indirect labour $40,000, indirect materials $30,000, power $5,000, depreciation $12,000, insurance $2,000; total $89,000. Actual machine hours were only 8,000 and actual overhead cost $77,300 (indirect labour 34,000; indirect materials 25,500; power 3,800; depreciation 12,000; insurance 2,000). How much of the favourable cost variance is due to lower activity and how much to good cost control?`,
st:[`<b>Static comparison (misleading):</b> 89,000 − 77,300 = 11,700 F. It is mostly due to making less.`,`<b>Step 1. Variable cost per hour:</b> indirect labour 40,000/10,000 = 4.00; indirect materials 3.00; power 0.50. Total <b>7.50 per hour</b>.`,`<b>Step 2. Fixed cost does not flex:</b> 12,000 + 2,000 = 14,000.`,`<b>Step 3. Flexed budget = variable rate × actual hours + fixed</b> = 7.50 × 8,000 + 14,000 = 60,000 + 14,000 = <b>74,000</b>.`,`<b>Step 4. Variance = actual − flexed.</b>`+tb([['','Flexed 8,000','Actual','Variance'],['Indirect labour','32,000','34,000','2,000 U'],['Indirect materials','24,000','25,500','1,500 U'],['Power','4,000','3,800','200 F'],['Fixed','14,000','14,000','0'],['<b>Total</b>','<b>74,000</b>','<b>77,300</b>','<b>3,300 U</b>']]),`The plant overspent by 3,300. Cost control was poor, not good.`],
a:'Flexed budget 74,000 · Variance 3,300 unfavourable'},
{s:'Day 6 · Flexible budget questions (slides 101 to 105)',q:`(Slide images; wording condensed to the data.)
Interspace: static budget for sales commissions was 29,000 units × $6; actual commissions were $182,700. Variance?

Trois Elles: flexible budget at 60,000 units (DM 120,000 + DL 60,000 + variable OH 90,000 + fixed 100,000). Actual cost 110,000 + 60,000 + 100,000 + 97,000. Variance?
Young: variable cost of 135,000 at 30,000 hours (180,000 at 40,000; 225,000 at 50,000), fixed cost 720,000. (a) The flexible-budget formula. (b) Budget at 35,000 hours.`,
st:[`<b>Interspace (static):</b> budget 29,000 × 6 = 174,000; actual 182,700. Variance = actual − budget = <b>8,700 U</b> (C).`,`<b>Gridiron (flexed):</b> 27,500 × 6 = 165,000; actual 171,400. <b>6,400 U</b> (A).`,`<b>Trois Elles:</b> flexed = 120,000 + 60,000 + 90,000 + 100,000 = <b>370,000</b>; actual 367,000. Variance = <b>3,000 F</b> (A).`,`<b>Young.</b> Variable rate = 135,000/30,000 = <b>4.50 per hour</b> (180,000/40,000 and 225,000/50,000 agree). Fixed 720,000. <b>Y = 4.50 × hours + 720,000</b> (B).`,`<b>At 35,000 hours:</b> 4.50 × 35,000 + 720,000 = 157,500 + 720,000 = <b>$877,500</b> (A).`,`Zin: a flexible budget covers the range of likely activity (78,000, 85,000 and 94,000 hours) (E).`],

{s:'Camelback Communications · Questions 1 to 6 (the case)',q:`Camelback Communications, Inc. (Harvard Business School 9-185-179). The firm uses a single burden rate: (budgeted variable + fixed overhead) / budgeted direct labor hours; standard cost = DL hours × rate + direct labor + material. Direct labor costs $5 an hour. Fixed overhead is 45,000.

Table A: Product Costs (A, B, C, D)
Material cost: $15.00, $5.00, $10.00, $5.00
Direct labor: 30.00, 5.00, 15.00, 10.00
Variable overhead: 15.00, 7.50, 5.00, 7.50
Variable cost: $60.00, $17.50, $30.00, $22.50
Fixed cost (equipment line): $10,000, $10,000, $12,500, $12,500
Lines A and B share identical equipment (1,000 units of A or B); lines C and D likewise.
Industry selling prices (true cost + 40% mark-on): A $98.00, B $38.50, C $59.50, D $49.00. Mark-on % = profit / cost. CCI drops products with a mark-on below 25%.

Questions
1. What will CCI now have to charge for each product to make a 40% mark-on? If CCI maintains its rule about dropping products with a mark-on below 25%, which additional products, if any, will it drop?
2. If you decide to drop additional product(s), recalculate the allocation rate per hour for the new product mix. Repeat Question 1.
3. What is going on?
4. What would happen if the firm kept its existing cost system but differentiated between variable and fixed cost and decided to maximize contribution?
5. What would happen if the firm modified its cost system so that all variable costs were traced to the product accurately but fixed costs were allocated using the existing system?
6. What would happen if the firm modified its cost system so that it contained two cost pools, one containing the overhead costs associated with Products A and B and the other the overhead costs associated with Products C and D, and then allocated these overhead pools on the basis of direct labor hours?`,
st:[`<b>Set-up (the case's own table).</b> DL hours per unit = DL / 5: A 6, B 1, C 3, D 2. Start (1,000 each): variable OH 35,000 + fixed 45,000 = 80,000 over 12,000 hours = <b>$6.67 per hour</b>. Standard cost: A 85.00, B 16.67, C 45.00, D 28.33. Mark-ons against industry price: A 15%, B 131%, C 32%, D 73%. A is below 25%, so A is dropped.`,
`<b>Q1.</b> Drop A; B doubles to 2,000. Variable OH = 15,000 + 5,000 + 7,500 = 27,500 + 45,000 = 72,500 over 7,000 hours = <b>$10.36 per hour</b>. Standard costs: B 20.36, C 56.07, D 35.71 (A 107.14). <b>Prices for 40%:</b> A 150.00, B 28.50, C 78.50, D 50.00. Mark-ons against industry: B 89%, <b>C 6%</b>, D 37%. <b>C is below 25% and is dropped.</b>`,
`<b>Q2.</b> Drop C; D doubles to 2,000. Variable OH = 15,000 + 15,000 = 30,000 + 45,000 = 75,000 over 6,000 hours = <b>$12.50 per hour</b>. Standard costs: B 22.50, D 40.00. <b>Prices for 40%:</b> B 31.50, D 56.00. Mark-on: B 71%, <b>D 22.5% (below 25%)</b>. D is dropped next. Repeating it leaves only B, with a loss (−3,000).`,
`<b>Q3. What is going on.</b> A single rate on labour hours loads fixed cost onto labour-heavy products. Each drop shrinks the hours base, so the rate rises (6.67 → 10.36 → 12.50 → 30.00) and the next product looks worse. This is a death spiral. The true economic profit falls: 70,000 with all four, 53,000 after dropping A, 50,000 after dropping A and C. The fixed cost (45,000) never goes away. The true costs are A 70.00, B 27.50, C 42.50, D 35.00. The system overstated A (+15) and C (+2.50) and understated B (−10.83) and D (−6.67).`,
`<b>Q4. Maximise contribution (separate variable and fixed).</b> CM per unit at industry prices: A 38.00, B 21.00, C 29.50, D 26.50. Each equipment line makes 2,000 units of one product. Best: A on line AB and C on line CD. <b>Make 2,000 A and 2,000 C: revenue 315,000 − variable 180,000 − fixed 45,000 = profit 90,000.</b> That beats 70,000 with the original mix.`,
`<b>Q5. Variable traced, fixed by DLH.</b> Start: fixed rate 45,000/12,000 = 3.75 per hour. Costs: A 82.50, B 21.25, C 41.25, D 30.00. Mark-ons: A 19% (<25%, dropped), B 81%, C 44%, D 63%. After A: rate 6.43; C 20.7% (dropped). After A and C: rate 7.50; B 54%, D 30.7%. It stops at B 2,000 and D 2,000: profit 50,000. The spiral is shorter, but it still drops products.`,
`<b>Q6. Two pools (AB and CD) by DLH.</b> Start: pool AB = 10,000 + 10,000 + 15,000 + 7,500 = 42,500 over 7,000 hours = 6.07 per hour. Pool CD = fixed 12,500 + 12,500 + variable OH 5,000 + 7,500 = 37,500 over 5,000 hours (3,000 + 2,000) = 7.50 per hour. Costs: A 81.43, B 16.07, C 47.50, D 30.00. Mark-ons: A 20% (dropped), B 140%, C 25.3%, D 63%. After A out: pool AB = 35,000 over 2,000 hours = 17.50; B costs 27.50 (exact, 40% mark-on 38.50). C 25.3% stays; D 63%. <b>It stabilises with B 2,000, C 1,000, D 1,000: profit 53,000.</b> Dropping A is still a wrong decision, but the spiral stops.`],
a:'Q1 prices 150 / 28.50 / 78.50 / 50.00, drop C · Q2 rate 12.50, prices B 31.50 / D 56.00, drop D · Q3 death spiral · Q4 A 2,000 + C 2,000, profit 90,000 · Q5 stops at B and D (50,000) · Q6 stops after A (53,000)'}
];

{k:'hl',t:'High-low (P11)',d:'Preloaded with the Day 5 example: low (3, 9) and high (12, 15). Use the lowest and highest activity, not cost.',
 f:[['xl','Low activity X',3],['yl','Cost at low Y',9],['xh','High activity X',12],['yh','Cost at high Y',15],['xn','Predict at X',8]],
 r(){const m=(val('yh')-val('yl'))/(val('xh')-val('xl')),b=val('yh')-m*val('xh');return [['m (variable / unit)',f(m,3),1],['b (fixed)',f(b,3),1],['Y at X',f(m*val('xn')+b)]]}},
{k:'pr',t:'Price from cost (P4)',d:'Preloaded with Set 1 P2: cost 16,275, profit 25% on cost, equal to 20% on selling price.',
 f:[['co','Total cost',16275],['px','Profit % on cost',25],['py','Profit % on price',20]],
 r(){const c=val('co');return [['Price (on cost)',f(c*(1+val('px')/100)),1],['Price (on selling price)',f(c/(1-val('py')/100)),1],['x% on cost = y% on price, y =',f(val('px')/(100+val('px'))*100)+'%']]}},
{k:'stp',t:'Rate or ratio share (P8)',d:'Preloaded with the rent: 10,000 shared by area 1500 : 1100 : 900 : 500.',
 f:[['cost','Cost',10000],['b1','Base A',1500],['b2','Base B',1100],['b3','Base C',900],['b4','Base D',500]],
 r(){const t=val('b1')+val('b2')+val('b3')+val('b4'),c=val('cost');return [['Rate per unit of base',f(c/t,4)],['A',f(c*val('b1')/t),1],['B',f(c*val('b2')/t),1],['C',f(c*val('b3')/t),1],['D',f(c*val('b4')/t),1]]}}
];
function renderCalc(){$('#main').innerHTML=CALC.map(c=>`<div class="card" id="c_${c.k}"><h3>${c.t}</h3><p class="d">${c.d}</p><div class="fields">${c.f.map(x=>field(x[0],x[1],x[2])).join('')}</div><div class="out" id="o_${c.k}"></div></div>`).join('');
 const run=()=>CALC.forEach(c=>{$('#o_'+c.k).innerHTML=c.r().map(r=>`<div class="o${r[2]?' key':''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')});
 document.querySelectorAll('#main input').forEach(i=>i.addEventListener('input',run));run()}
function renderIdx(){$('#main').innerHTML=`<div class="card"><h3>Every numerical, mapped to its pattern</h3><p class="d">Tap a pattern chip to open its steps and solved answers.</p><div class="scroll"><table><thead><tr><th>Numerical</th><th>Where it is</th><th>Pattern</th><th>Key answer</th></tr></thead><tbody>${IDX.map(r=>`<tr><td>${r[0]}</td><td>${WH[r[0]]||''}</td><td>${r[1].split(',').map(id=>{const p=P.find(x=>x.id===id);return `<button class="pl" data-p="${id}" style="background:${col(p.g)}">${id}</button>`}).join('')}</td><td class="m">${r[2]}</td></tr>`).join('')}</tbody></table></div><p class="note">Slide typos to ignore: Savor 3,247 vs 3,263; Example 2 prints 2.9215 (correct 2.9125); Set 1 P1 706,620 vs 706,625; Set 3 P2 Stores 600 / 400; PlayCraft DM 270,000.</p></div>`}
function render(){$('#finder').hidden=tab!=='map';document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.t===tab));
 ({guide:renderGuide,map:()=>{renderChips();renderMap()},ladder:renderLadder,calc:renderCalc,index:renderIdx})[tab]()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-p],[data-c],[data-g],[data-go],[data-tr],#clr,#cl');if(!t)return;
 if(t.dataset.go){trail.push(t.dataset.go);renderGuide();return}
 if(t.dataset.tr!==undefined){trail=trail.slice(0,+t.dataset.tr+1);renderGuide();return}
 if(t.dataset.t){tab=t.dataset.t;render()}
 else if(t.dataset.p){openP(t.dataset.p)}
 else if(t.dataset.c){query=query===t.dataset.c?'':t.dataset.c;$('#q').value=query;renderChips();renderMap()}
 else if(t.dataset.g){grp=grp===t.dataset.g?'':t.dataset.g;renderChips();renderMap()}
 else if(t.id==='clr'){query='';grp='';$('#q').value='';renderChips();renderMap()}
 else if(t.id==='cl'){$('#dlg').close()}});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close()});
$('#q').addEventListener('input',e=>{query=e.target.value.trim();renderChips();renderMap()});
render();
</script>

</body></html>
