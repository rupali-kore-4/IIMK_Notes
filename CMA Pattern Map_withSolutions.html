<style>
/* Layout: sticky header with search, tabs (Map / Ladder / Calculators / Index); Map = grouped tiles that open a detail sheet */
:root{--bg:#F5F7FA;--panel:#FFFFFF;--ink:#14213A;--mute:#5B6780;--line:#D5DCE7;
--gA:#1F3A5F;--gB:#0F7C85;--gC:#A8620A;--gD:#2C7A43;--gE:#6B3F94;--tA:#E5ECF6;--tB:#DDF1F2;--tC:#FBEDD6;--tD:#E0F2E5;--tE:#EDE3F6;--sw:#B3261E;--swt:#FBE6E4;--hl:#FFE27A;
--disp:'Space Grotesk','Segoe UI',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1524;--panel:#16203A;--ink:#E7ECF6;--mute:#9AA7C0;--line:#2A375A;
--gA:#7FA6DB;--gB:#4CC4CD;--gC:#E8A24A;--gD:#6CCB86;--gE:#B993E0;--tA:#1B2B48;--tB:#12363B;--tC:#3A2A14;--tD:#173823;--tE:#2C2142;--sw:#FF8A80;--swt:#3B1B1B;--hl:#6B5A10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1524;--panel:#16203A;--ink:#E7ECF6;--mute:#9AA7C0;--line:#2A375A;
--gA:#7FA6DB;--gB:#4CC4CD;--gC:#E8A24A;--gD:#6CCB86;--gE:#B993E0;--tA:#1B2B48;--tB:#12363B;--tC:#3A2A14;--tD:#173823;--tE:#2C2142;--sw:#FF8A80;--swt:#3B1B1B;--hl:#6B5A10;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
header{padding:18px 0 10px}
h1{font:700 26px/1.1 var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--mute);margin:6px 0 0;max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gB);outline-offset:2px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:400 14px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:500 12px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:99px;padding:3px 10px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gh{font:700 12px var(--disp);letter-spacing:.08em;text-transform:uppercase;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.gh i{width:10px;height:10px;border-radius:2px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0;position:relative}
.tile:hover{border-color:var(--ink)}
.tile:focus-visible{outline:2px solid var(--gB);outline-offset:2px}
.tile .top{display:flex;align-items:center;gap:8px}
.badge{font:700 12px var(--mono);padding:2px 7px;border-radius:4px;color:#fff}
.tile .nm{font:700 14px var(--disp);line-height:1.15}
.tile .hook{font:400 12px/1.45 var(--mono);color:var(--ink);background:var(--bgt,var(--tA));padding:6px 8px;border-radius:5px;overflow-wrap:anywhere}
.tile .tr{font-size:12px;color:var(--mute)}
.tile.hit{outline:2px solid var(--hl);outline-offset:1px}
.tile.dim{opacity:.28}
.empty{color:var(--mute);padding:20px 0}
/* sheet */
dialog{border:0;padding:0;background:transparent;max-width:min(760px,calc(100vw - 24px));width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(8,14,28,.55)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.sh-h{padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px}
.sh-h h2{font:700 18px var(--disp);margin:0;flex:1}
.sh-h button{all:unset;cursor:pointer;font:600 13px var(--body);padding:4px 10px;border:1px solid rgba(255,255,255,.6);border-radius:5px}
.sh-b{padding:6px 16px 16px;overflow:auto}
.sec{margin-top:12px}
.lab{font:700 11px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.sec.sw .lab{color:var(--sw)}
.sec.sw .txt{background:var(--swt);border-left:3px solid var(--sw);padding:8px 10px;border-radius:0 6px 6px 0}
.sec ol{margin:0;padding-left:20px}.sec li{margin:3px 0}
.txt b{font-weight:600}
code,.m{font-family:var(--mono);font-size:12.5px}
.seen{color:var(--mute)}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
/* ladder + calcs */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}
.card h3{font:700 16px var(--disp);margin:0 0 4px}
.card p.d{margin:0 0 10px;color:var(--mute)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fld label{display:block;font:600 11px var(--body);color:var(--mute);margin-bottom:2px}
.fld input{width:100%;font:400 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);min-width:0}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.o{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--bg)}
.o span{display:block;font:600 11px var(--body);color:var(--mute)}
.o b{font:600 16px var(--mono)}
.o.key{border-color:var(--gB);background:var(--tB)}
.flow{display:grid;gap:10px;margin-top:12px}
.row{display:grid;grid-template-columns:70px repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.row .lv{font:700 13px var(--disp);display:flex;align-items:center}
.bx{border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:var(--bg);font-size:11px;color:var(--mute);min-width:0}
.bx b{display:block;font:600 14px var(--mono);color:var(--ink)}
.bx.res{background:var(--tA);border-color:var(--gA)}
.bx .op{font:700 11px var(--mono);color:var(--gB)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
th{background:var(--tA);font:700 12px var(--disp)}
td .pl{all:unset;cursor:pointer;font:700 12px var(--mono);padding:2px 7px;border-radius:4px;color:#fff;display:inline-block;margin-right:3px}
.pl:focus-visible{outline:2px solid var(--gB)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.plain .txt{font-size:15px;line-height:1.55}
.kw{display:inline-block;background:var(--tA);border-radius:99px;padding:1px 9px;margin:0 4px 4px 0;font-size:12.5px}
.ex{background:var(--tB);border-radius:6px;padding:8px 10px}
.rt{min-width:480px}.rt td{font-size:12.5px}
details.sec summary{cursor:pointer}.hookf{background:var(--tA);padding:6px 8px;border-radius:5px;margin:4px 0 8px}
.qn{font:700 20px/1.25 var(--disp);margin:6px 0 12px;text-wrap:balance}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px;line-height:1.4}
.opt:hover{border-color:var(--ink)}.opt:focus-visible{outline:2px solid var(--gB);outline-offset:2px}
.crumb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.res{border:2px solid;border-radius:10px;padding:14px;background:var(--bg)}.res .nm{font:700 18px var(--disp)}.res p{margin:8px 0}
@media (max-width:640px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}.row .lv{grid-column:1/-1}h1{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.tile{transition:border-color .15s,opacity .15s}}

.qbox{white-space:pre-wrap;font-size:12.5px;line-height:1.5;background:var(--surface-2,rgba(127,127,127,.08));border:1px solid var(--line,rgba(127,127,127,.25));border-radius:8px;padding:10px 12px;margin:6px 0;overflow-wrap:anywhere}
.pb{border:1px solid var(--line,rgba(127,127,127,.3));border-radius:10px;margin:8px 0;padding:0 12px}
.pb>summary{list-style:none;cursor:pointer;padding:10px 0;font-weight:600;font-size:13.5px}
.pb>summary::before{content:'▸ ';float:left;margin-right:6px}.pb[open]>summary::before{content:'▾ '}.pb .src{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.65}
.pb ol.sol{margin:6px 0 8px;padding-left:20px}.pb ol.sol li{margin:6px 0;font-size:13.5px;line-height:1.5}
.pb .fin{margin:8px 0 12px;padding:8px 10px;border-left:3px solid var(--acc,#2a7);background:rgba(40,160,110,.1);border-radius:0 6px 6px 0;font-size:13px;font-weight:600}
.pb .qh{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.7;margin-top:8px}
.pt{min-width:0!important}.pt td,.pt th{padding:3px 7px;font-size:12px}
</style>

<header>
<h1>CMA Pattern Map</h1>
<p class="sub">Start with “Which pattern?”: answer a few simple questions and it tells you the pattern, explains it in plain words, gives the steps, and lists the exact problem set or slide where the professor used it. Professor's methods only.</p>
</header>

<div class="tabs" role="tablist" id="tabs">
<button class="tab" role="tab" data-t="guide" aria-selected="true">Which pattern?</button>

</div>

<script>
const G={A:{n:'Cost accounting',c:'--gA',t:'--tA'},B:{n:'Overhead',c:'--gB',t:'--tB'},C:{n:'CVP and decisions',c:'--gC',t:'--tC'},D:{n:'Budgets',c:'--gD',t:'--tD'},E:{n:'Case',c:'--gE',t:'--tE'}};
const P=[
{id:'P1',g:'A',n:'Cost sheet (forward)',hook:'Prime = DM used + DL · TMC = PC + MOH · COGM = TMC ± WIP · COGS = COGM ± FG',
spot:'cost sheet, prime cost, works cost, cost of production, profit, statement of cost',
do:['DM AFU = opening + purchases + freight − returns; DM used = AFU − closing','+ DL (+ direct expenses) = <b>Prime cost</b>','+ factory OH = <b>TMC</b> (works cost gross)','± WIP = <b>COGM</b> (works cost net)','Layout B only: + admin = cost of production','± FG = <b>COGS</b>','+ selling &amp; distribution (+ admin in layout A) = <b>cost of sales</b>','Sales − cost of sales = <b>profit</b>','Adjust first: + accrued, − prepaid; returns reduce purchases; drop financial items (interest, bad debt, dividend income); asset purchase → only depreciation; shared cost by ratio (8:1:1; rates 2/3 factory, 1/3 office)'],
sw:'<b>Layout A</b>: admin is a period cost (COGS + admin + selling). <b>Layout B</b>: admin added to production. Total cost and profit are the same; closing-stock value differs.',
seen:'Set 1 P1: DM used 291,200; PC 509,200; MOH 170,550; TMC 679,750; COGM 687,750; COP (B) 706,625; COGS 652,750; NMC 111,275; loss (10,025). P3: profit 24,300 either layout. P4: 5,580 or 5,370. Day 3 class Day 1 / Day 2.'},
{id:'P2',g:'A',n:'Back-solve the missing box',hook:'CC = DL ÷ (1−x) · COGS = sales × (1−GM%) · closing = available − used',
spot:'closing stock missing, fire, find DL, find MOH, GM%, indirect costs are x% of conversion cost',
do:['Draw the ladder (Cost ladder tab) and fill what is known','Solve the unknown from its own row: closing = available − used','DL = TMC − DM used − MOH','MOH is x% of CC → <b>CC = DL ÷ (1−x)</b>; MOH = CC − DL','GM% → <b>COGS = sales × (1−GM%)</b>; closing FG = FG AFS − COGS; COGM = FG AFS − opening FG; closing WIP = WIP AFU − COGM','Fixed MOH = total MOH − variable MOH'],
sw:'',seen:'Set 2 Q1: CC 18 ÷ 0.6 = 30, MOH 12; closing DM 6.2, WIP 2.8, FG 5.0 (Rs lakh). Q4 (Rs mn): closing DM 750; DL 7,450; fixed MOH 2,300; closing WIP 1,500; AFS 18,250.'},
{id:'P3',g:'A',n:'Per-unit cost and inventory',hook:'Unit cost = mfg cost ÷ units produced · price = revenue ÷ units sold',
spot:'units produced not equal units sold, closing FG at cost, variable marketing, not inventoriable',
do:['Unit mfg cost = total mfg cost ÷ units <b>produced</b>','FG units = produced − sold (or FG value ÷ unit cost)','COGS = total mfg cost − FG value','Price = revenue ÷ units <b>sold</b>','Variable mfg cost follows <b>produced</b>; variable marketing follows <b>sold</b>; fixed mfg cost goes into stock','OI = revenue − COGS − marketing − fixed non-mfg'],
sw:'<b>"Not inventoriable"</b>: take that cost out of unit cost (2.33 → 2.01), expense it separately. Profit falls by FG units × amount per unit.',
seen:'Set 2 Q2: DM 1,400; 9,000 FG units; price 4.80; OI 11,920. Q3: unit cost 2.01; OI 9,040 (= 11,920 − 9,000 × 0.32). Set 1 P4. PlayCraft (d).'},
{id:'P4',g:'A',n:'Price or quote',hook:'x% on cost → cost × (1+x) · y% on price → cost ÷ (1−y)',
spot:'quote a price, profit 25% on cost, profit on selling price, overhead as % of wages',
do:['Works OH % = works OH ÷ wages (or DL)','E&amp;G (admin) % = E&amp;G ÷ works cost','Apply both % to the new job','Price = cost × (1+x) for x% on cost'],
sw:'<b>y% on selling price</b> → price = cost ÷ (1−y). 25% on cost = 20% on price.',seen:'Set 1 P2: works cost 380,000; OH 25% of wages; E&amp;G 5%; new job cost 16,275; price 20,343.75. P3: factory OH % of DL, admin % of works cost, selling % of sales.'},
{id:'P5',g:'A',n:'Classify and relevant cost',hook:'Does the TOTAL change with activity? yes = variable, no = fixed',
spot:'fixed, variable, mixed, direct, indirect, product cost, period cost, relevant, sunk, opportunity, value-added',
do:['<b>Variable</b>: total = v × units, per unit constant. <b>Fixed</b>: total constant, per unit = F ÷ units. <b>Mixed</b>: Y = F + vX','<b>Relevant</b> = future AND differs between alternatives','Differential = A − B; marginal = one more unit; sunk = ignore; opportunity = best forgone benefit','Product cost = DM+DL+MOH (inventory); period = selling + admin','Value-added: would the customer pay for it?'],
sw:'Fixed cost <b>per unit</b> must never be multiplied by a new volume. Fixed is fixed <b>in total</b>.',seen:'Day 2 CP1–5; QFT4 (gasoline variable, insurance fixed); Elaine fixed cost 850,000 (a); pizza, rent, HBO per-unit fixed; Day 1 VA / NVA.'},
{id:'P6',g:'A',n:'T-account flow',hook:'COGM = % finished × WIP total · COGS = % sold × FG',
spot:'RM WIP FG accounts, percent finished, percent sold, PlayCraft, Solomon Grundy',
do:['Raw material: open + purchases − closing = used (indirect material goes to MOH)','WIP: + DL + MOH = total; <b>COGM = % finished × WIP total</b>; rest stays in WIP','FG: <b>COGS = % sold × FG</b>; rest stays in FG','Free material = nil; machine or furniture bought = asset','Factory power, supervisor, repairs = MOH; freight outward, advertising, office salary = period'],
sw:'',seen:'Solomon Grundy: COGM 5,520 (80%); WIP 1,380; COGS 3,864 (70%); FG 1,656. PlayCraft: DM 270,000; MOH 211,000; COGM 621,000; COGS 611,000; GP 589,000; OP 481,000.'},
{id:'P7',g:'A',n:'Statement format',hook:'GM format: sales − COGS · CM format: sales − all variable',
spot:'gross margin statement, contribution margin statement, income statement format',
do:['<b>GM format</b>: sales − COGS = gross margin; − selling − admin = OI','<b>Contribution format</b>: sales − all variable (mfg + selling + admin) = CM; − all fixed = OI','Building depreciation etc. split by area (Madi)'],
sw:'Same OI only if there is no inventory change.',seen:'Day 3: sales 1,000 → OI 182 in both formats. Madi: 100,000 split 80/10/10.'},
{id:'P8',g:'B',n:'Primary distribution',hook:'Ratio: part ÷ total × cost · Rate: cost ÷ total base × dept base',
spot:'share rent, power, light, insurance, supervision among departments, apportion overhead',
do:['<b>Ratio</b>: write base across depts, cancel common factors, share = part ÷ total × cost (1500:1100:900:500 = 15:11:9:5)','<b>Rate</b>: rate = cost ÷ total base; share = rate × dept base','Check: sum of depts = total cost','A dept without that base gets nil and is left out of its ratio','Bases: rent, building depreciation → area · plant repairs, depreciation → plant value · power → horse power · light → light points · supervision, canteen → employees or wages · fire insurance on stock → stock value · stores → requisitions · time-keeping → employees · repairs → hours'],
sw:'Same answer by ratio or rate; do one, check with the other.',seen:'Set 3 P1: total 52,000; rent 10,000 area 15:11:9:5 → A 3,750; totals A 22,150, B 15,075, C 10,000, D 4,775.'},
{id:'P9',g:'B',n:'Service to production',hook:'Reciprocal: E = (E₀ + a·F₀) ÷ (1 − a·b)',
spot:'stores maintenance time-keeping serve each other, direct method, step method, reciprocal, repeated distribution, dual rate',
do:['<b>Direct</b>: ignore service↔service; ratio among production depts only','<b>Step</b>: start with the dept serving most others; new total = own + received; base excludes itself and closed depts; sequence changes the answer','<b>Reciprocal</b>: E = E₀ + a·F; F = F₀ + b·E → <b>E = (E₀ + a·F₀) ÷ (1 − a·b)</b>, then F; then P = P₀ + %E·E + %F·F','<b>Repeated distribution</b>: push balances back and forth until ≈ 0 (same totals)'],
sw:'Percentages from a ratio use the <b>whole</b> ratio (incl. the other service dept): E → A4:B5:C7:F4 = 20/25/35/20; direct uses 4:5:7 only. <b>Single rate</b> = total cost ÷ total base. <b>Dual rate</b> = variable pool × actual use + fixed pool × budgeted use.',
seen:'Set 3 P2 direct: 17,100 / 14,500 / 13,200. P3 step: X 15,421, Y 10,579. P4 reciprocal: E 2,693.88, F 3,538.78; A 9,423.47, B 8,058.16, C 9,358.37 (26,840). Day 4 mini example.'},
{id:'P10',g:'B',n:'Common cost and bundle',hook:'Share = SA ÷ ΣSA × common cost',
spot:'common cost, users share facility, stand-alone, incremental, bundle price split, revenue allocation',
do:['<b>Stand-alone</b>: share = SA<sub>i</sub> ÷ ΣSA × common cost','<b>Incremental</b>: rank users; first user pays own SA; next pays (total − first SA)','<b>Bundle</b>: product share = bundle price × weight ÷ Σ weights (weights = stand-alone selling prices; or unit cost; or units)'],
sw:'Incremental depends on the ranking; compromise = equal split of the rest.',seen:'Walk-through 14.7 / 14.8: SA 75 and 85, joint 115 → 47% / 53% → 54.05 / 60.95; incremental 75 / 40 (or 57.50 each).'},
{id:'P11',g:'C',n:'Cost estimation',hook:'m = ΔY ÷ ΔX · b = Y − mX',
spot:'high-low, regression, mixed cost, estimate fixed and variable, data points, account analysis',
do:['<b>High-low</b>: pick highest and lowest <b>activity</b>; m = ΔY ÷ ΔX; b = Y − mX','<b>Regression</b>: slope = variable cost per unit, intercept = fixed; Excel =SLOPE(Y,X), =INTERCEPT(Y,X), =FORECAST(), or Data Analysis → Regression','<b>Account analysis</b>: read fixed and variable from the bill'],
sw:'High-low uses 2 points only; regression uses all. When usage changes, scale only the <b>variable</b> part.',seen:'Deck: (3, 9) and (12, 15) → m 0.67, b 6.96. Regression 14.98 / 8,773.72. Water: 770 × 12 + 1,709 × 12. Cheese Co.: Y = 7.50X + 14,000.'},
{id:'P12',g:'C',n:'Absorption vs variable',hook:'Profit(abs) − Profit(var) = (produced − sold) × FMOH per unit',
spot:'two profit figures, absorption costing, variable costing, inventory change, marginal cost',
do:['<b>Absorption</b> unit cost = DM + DL + VMOH + <b>FMOH ÷ units produced</b>','<b>Variable</b> unit cost excludes FMOH (expensed)','<b>Profit(abs) − Profit(var) = (produced − sold) × FMOH/unit</b>','Marginal cost = prime cost + variable OH'],
sw:'Equal profit if produced = sold. If DL is fixed (Indian practice) leave it out of marginal cost.',seen:'4,000 made, 3,800 sold, FMOH 50,000 → 12.50 × 200 = 2,500 (5,500 vs 3,000); inventory 4,500 vs 2,000. Marginal cost 8.00.'},
{id:'P13',g:'C',n:'CVP basics',hook:'BE units = FC ÷ CM · BE sales = FC ÷ CM ratio · OL = CM ÷ OI',
spot:'break-even, target profit, tax, margin of safety, operating leverage, contribution margin ratio',
do:['CM/unit = P − v; <b>CM ratio</b> = CM ÷ P','Break-even: <b>units = FC ÷ CM/unit</b>; <b>sales = FC ÷ CM ratio</b>','Target: units = (FC + TP) ÷ CM/unit; sales = (FC + TP) ÷ CM ratio','<b>Net target → OI = NI ÷ (1 − t)</b> first','MOS = budget − BE; ratio = MOS ÷ budget','<b>OL = CM ÷ OI; %ΔOI = OL × %Δsales</b>'],
sw:'<b>Units</b> answer uses CM per unit; <b>rupee</b> answer uses CM ratio. OL changes with the sales level.',seen:'Tee Times: CM 200; BE 250; TP 90,000 → 700 sets; NI 63,000 at 30% → 420,000. Coffee Klatch: CM 1.13; ratio 0.758; BE 1,150; 3,363 cups; 5,013; MOS 950; OL 2.21; +20% → +44.2%.'},
{id:'P14',g:'C',n:'Multi-product and mix',hook:'WACM = Σ mix × CM · BE units = FC ÷ WACM',
spot:'several products, sales mix, weighted average contribution margin, change of mix',
do:['<b>Mix in units</b>: WACM = Σ mix × CM/unit; BE units = FC ÷ WACM; each product = BE × mix','<b>Mix in sales ₹</b>: contribution = sales × CM ratio of each; profit = ΣCM − FC; compare old and new mix'],
sw:'Keep the mix: units must be in the ratio. Slide shows 3,247 (rounded WACM); exact 3,263.',seen:'Savor the Flavor: WACM 1.5325; BE 3,263 (816 / 489 / 1,958). Eg 5: profit 12,600 → 8,280.'},
{id:'P15',g:'C',n:'What-if (RBC)',hook:'ΔProfit = ΔQ × CM − ΔFC',
spot:'what if, price change, variable cost change, advertising, commission, volume change, wholesaler',
do:['Base: P 500, v 300, FC 80,000, Q 500 → profit 20,000','New profit = new Q × new CM − new FC; compare with base','Volume and fixed only: <b>ΔProfit = ΔQ × CM − ΔFC</b>'],
sw:'Price or v change → CM changes for <b>all</b> units. Commission replaces salary → v up, FC down.',seen:'540 units + 10,000 ad → −2,000. v 310, Q 580 → +10,200. P 480, FC +15,000, Q 650 → +2,000. Commission (+15 / −6,000, Q 575) → +12,375. Wholesaler 150 units at 320 = 300 + 3,000 ÷ 150.'},
{id:'P16',g:'C',n:'Special order and minimum price',hook:'Spare: variable + order fixed + profit · Full: add opportunity cost',

do:['<b>Spare capacity</b>: price ≥ variable cost + order-specific fixed (tools, ads) + wanted profit; ignore existing fixed','<b>Scarce resource</b>: contribution per hour = CM ÷ hours; opportunity cost = hours × that; accept only if price &gt; DM + labour + VOH + opportunity cost','<b>Extra capacity</b>: flex each cost (split mixed), contribution needed = fixed + target profit − existing contribution'],

{id:'P17',g:'D',n:'Master budget to cash',hook:'Production = sales + end FG − begin FG · borrow = minimum − balance',
spot:'sales forecast, purchases, direct labour hours, collections, payments, cash budget, borrowing, receivables',

const EXT={
P1:{plain:'A cost sheet follows the money through the factory from left to right: materials come in, labour and factory costs are added, some work is still unfinished (WIP), some finished goods are still unsold (FG), and what is left was sold.',
easy:['<b>Materials used</b>: opening + bought + freight − returned, then minus what is left at the end.','<b>Add labour</b> (paid + accrued) and direct expenses. That is the <b>prime cost</b>.','<b>Add factory overhead</b>. For a shared cost, take only the factory share. That is the <b>total manufacturing cost (TMC)</b>.','<b>Unfinished work</b>: add opening WIP, subtract closing WIP. That is the <b>cost of goods made (COGM)</b>.','<b>Unsold stock</b>: add opening FG, subtract closing FG. That is the <b>cost of goods sold (COGS)</b>.','<b>Add admin and selling costs</b>. Sales minus this total is the <b>profit</b>.'],
vs:'All stock figures given → P1. One figure missing → P2. Costs per unit, with units sold different from units made → P3. Asked for a selling price → P4.',
ex:'Day 1 class numbers: DM 0 + 400 + 50 − 25 = 425; − closing 225 = <b>200 used</b>. + DL 100 + MOH 50 = <b>TMC 350</b>. WIP: 350 − closing 75 = <b>COGM 275</b>. FG: 275 − closing 50 = <b>COGS 225</b>.',
refs:[['Set 1 P1 (Problem_set_1.pdf, EXCEL-1 sheet P1s1)','ABC Ltd cost sheet','PC 509,200; TMC 679,750; COGM 687,750; COGS 652,750; loss (10,025)'],['Set 1 P3 (EXCEL-1 P3s1)','Cost sheet with % rates','profit 24,300'],['Set 1 P4 (EXCEL-1 P4s1)','Per-unit cost sheet','5,580 or 5,370'],['Day 3 slides 14–19','Class funnel, Day 1','TMC 350, COGM 275, COGS 225'],['Day 3 slides 23–29','Class funnel, Day 2','TMC 600, COGM 400, COGS 375'],['PlayCraft question and solution files','Toy maker T-accounts','TMC 631,000; COGM 621,000; COGS 611,000']]},
P2:{plain:'Some numbers are hidden, but every stock box follows the same rule, so you can work backwards from what you know. It is a puzzle: find a row with only one unknown, solve it, and that answer unlocks the next row.',
easy:['Draw the <b>ladder</b> (DM row, WIP row, FG row) and write every known number in it.','Find a row with <b>one</b> missing number and solve it: closing = opening + added − used.','If a <b>percentage</b> is given, turn it into a sum first: "MOH is 40% of conversion cost" means DL is 60% of it, so CC = DL ÷ 0.6.','GM% gives COGS: <b>sales × (1 − GM%)</b>. Then closing FG = FG available − COGS.','Move to the next row with the new number. Repeat until every box is filled.'],
vs:'Everything given → P1. Per-unit and units given → P3. Here something that normally is an input (a stock, DL, MOH) is the answer.',
ex:'Set 2 Q1: DL 18 is 60% of CC → CC 30, MOH 12. PC 29.4 − DL 18 = DM used 11.4; DM AFU 17.6 − 11.4 = <b>closing DM 6.2</b>. TMC 41.4; WIP AFU 44.8. COGS = 50 × 0.8 = 40; closing FG 45 − 40 = <b>5.0</b>; COGM 45 − 3 = 42; closing WIP 44.8 − 42 = <b>2.8</b>.',
refs:[['Set 2 Q1 (Problem_set_2, EXCEL-1 sheet for set 2)','Fire at the plant, stocks on 28 Feb','DM 6.2; WIP 2.8; FG 5.0 (Rs lakh)'],['Set 2 Q4','ABC, September 2014 (Rs million)','closing DM 750; DL 7,450; fixed MOH 2,300; WIP 1,500; AFS 18,250']]},
P3:{plain:'Production costs sit in stock until the goods are sold. So only the cost of the units sold hits this year\'s profit; unsold units carry their cost into closing stock. Fixed factory cost is spread over the units produced.',
easy:['Add up <b>all manufacturing cost</b>: DM, DL, variable and fixed factory overhead.','Divide by <b>units produced</b> to get the cost per unit.','Unsold units = produced − sold. Closing FG = unsold units × cost per unit.','<b>COGS</b> = total manufacturing cost − closing FG value.','Selling price = revenue ÷ units <b>sold</b>.','Marketing, selling and admin are period costs: they never go into stock.'],
vs:'P3 uses absorption costing (fixed factory cost goes into stock). If the question also asks for variable costing or the difference between the two profits, go to P12. If a cost is declared "not inventoriable", remove it from the unit cost first.',
ex:'Set 2 Q2: manufacturing cost 233,000 ÷ 100,000 units = <b>2.33</b>. FG 20,970 ÷ 2.33 = <b>9,000</b> units. Sold 91,000; price 436,800 ÷ 91,000 = <b>4.80</b>. COGS 212,030; OI <b>11,920</b>.',
refs:[['Set 2 Q2','ABC metal shelving','DM stock 1,400; FG 9,000 units; price 4.80; OI 11,920'],['Set 2 Q3','Indirect cost not inventoriable','unit cost 2.01; OI 9,040'],['Set 1 P4','Per-unit cost sheet','cost 0.63 a unit; profit 5,580'],['PlayCraft part (d)','Fixed and variable with production','fixed per toy falls as output rises']]},
P4:{plain:'Last year\'s accounts tell you how big overhead usually is compared with something simple, like wages or works cost. Use those percentages to cost a new job, then add the profit.',
easy:['Find the percentages: <b>works OH ÷ wages</b> (or DL) and <b>E&amp;G ÷ works cost</b>.','List the new job\'s materials and wages: that is its prime cost.','Add works OH using the first percentage. That is the works cost.','Add E&amp;G using the second percentage on works cost. That is the total cost.','Add profit: "x% on cost" → cost × (1 + x). "y% on selling price" → cost ÷ (1 − y).'],
vs:'P4 prices a new job from old percentages. P1 reports a finished period. 25% on cost equals 20% on selling price, so both ways give the same price.',
ex:'Set 1 P2: works OH 40,000 ÷ wages 160,000 = 25%; E&amp;G 19,000 ÷ works cost 380,000 = 5%. New job 8,000 + 6,000 = 14,000; OH 1,500; works cost 15,500; E&amp;G 775; <b>cost 16,275</b>; price <b>20,343.75</b>.',
refs:[['Set 1 P2 (EXCEL-1 sheet P2s1)','Steelsways Engineering estimate','cost 16,275; price 20,343.75'],['Set 1 P3','Factory OH % of DL; admin % of works cost; selling % of sales','profit 24,300']]},
P5:{plain:'Before any calculation, decide what kind of cost you are looking at. The behaviour (does it move with activity?) and the purpose (is it relevant to this decision?) tell you how to treat it.',
easy:['<b>Variable?</b> If output doubles, does the <b>total</b> double? Yes → variable. Per unit it stays the same.','<b>Fixed?</b> Total stays the same. Per unit falls as units rise. Never multiply a per-unit fixed cost by a new volume.','<b>Mixed?</b> Part fixed, part variable: Y = F + vX.','<b>Relevant?</b> Only if it is in the future AND differs between the options.','Already spent → <b>sunk</b>, ignore. Benefit you give up → <b>opportunity cost</b>, include.','<b>Value-added?</b> Would the customer pay for this activity? If not, it is non-value-added.'],
vs:'P5 is about words and definitions. As soon as numbers are used to find fixed and variable parts, go to P11.',
ex:'QFT 4: the doctor said gasoline is fixed and insurance is variable. Wrong: gasoline total rises with miles (<b>variable</b>); insurance total stays the same (<b>fixed</b>), only cost per mile falls.',
refs:[['Day 2 slide 13','QFT 4: doctor and her car','gasoline variable, insurance fixed'],['Day 2 slides 14–21','Per-unit fixed cost (pizza, rent, HBO)','fixed per unit falls as units rise'],['Day 2 slide 25–26','CP-3 cones; CP-4 Elaine Co.','C and D; fixed 850,000 (a)'],['Day 2 slide 27','CP-5 Rosland Graphics','(b)'],['Day 2 slide 33','CP-1, 2, 3 relevance','A yes; B no; sale value = opportunity cost'],['Day 1 slides 29–35','Value-added, ethics cases, CP','see notes']]},
P6:{plain:'Follow the goods day by day through three storerooms: raw material (RM), work in process (WIP) and finished goods (FG). Each move takes cost out of one room and puts it in the next.',
easy:['Draw three T-accounts: RM, WIP, FG (and COGS).','Buying material adds to <b>RM</b>. Sending material to production moves it to <b>WIP</b>.','Add DL and MOH to <b>WIP</b>.','"Finished x%" means x% of the WIP total moves to FG. That moved amount is <b>COGM</b>; the rest stays in WIP.','"Sold y%" means y% of FG moves to <b>COGS</b>; the rest stays in FG.','Machines and furniture bought are assets, not costs. Free material costs nil.'],
vs:'Same idea as P1, but given as day-by-day events or percentages instead of opening and closing balances.',
ex:'Solomon Grundy: RM 10,000; DM 3,600 to WIP (RM 6,400); + DL 2,500 + MOH 800 = WIP 6,900. 80% finished: <b>COGM 5,520</b>, WIP <b>1,380</b>. 70% sold: <b>COGS 3,864</b>, FG <b>1,656</b>.',
refs:[['Day 3 slides 31–32','Now You Do It: Solomon Grundy','RM 6,400; WIP 1,380; FG 5,520; COGS 3,864'],['PlayCraft (question_-_Copy.docx and solution xlsx)','Toy maker','DM 270,000; MOH 211,000; COGM 621,000; COGS 611,000; GP 589,000; OP 481,000']]},
P7:{plain:'The same profit can be shown in two layouts. The gross-margin layout groups costs by <b>function</b> (making vs selling and admin). The contribution layout groups them by <b>behaviour</b> (variable vs fixed).',
easy:['<b>Gross-margin layout</b>: Sales − COGS = gross margin. Then subtract selling and admin to get operating income.','<b>Contribution layout</b>: Sales − all variable costs (production, selling and admin) = contribution margin. Then subtract all fixed costs.','If inventory did not change, both layouts show the same operating income.','A building used for making, selling and admin: split its depreciation by floor area, factory share into MOH.'],
vs:'Asked for "gross margin" → first layout. Asked for "contribution margin" or CVP → second layout.',
ex:'Day 3 statement example: sales 1,000 → operating income <b>182</b> in both layouts. Madi: depreciation 100,000 split 80 / 10 / 10 by area.',
refs:[['Day 3 slide 20','Gross margin and contribution margin statements','OI 182'],['Day 2 slide 50','Gross margin statement','—'],['Day 4 slide 2','QFT 5: Madi Corporation building','split by area']]},
P8:{plain:'Overhead belongs to the whole factory, but each department should carry its fair share. "Fair" means by the thing that causes the cost: rent by floor area, power by horse power, and so on.',
easy:['For each cost, <b>pick the base</b> from the table (area, plant value, horse power…).','Write the base for each department in a row.','<b>Ratio method</b>: cancel to smallest numbers (1500:1100:900:500 = 15:11:9:5); share = part ÷ total × cost.','<b>Rate method</b>: rate = cost ÷ total base; share = rate × the department\'s base. Same answer.','A department with none of that base (no stock, no horse power) gets nil.','Total each column. The grand total must equal the original total cost.'],
vs:'P8 spreads factory-wide costs to all departments. P9 comes next: it pushes service-department costs into production departments.',
ex:'Set 3 P1: rent 10,000 by area 15:11:9:5 → A <b>3,750</b>, B 2,750, C 2,250, D 1,250. Column totals: A <b>22,150</b>, B 15,075, C 10,000, D 4,775 = 52,000.',
refs:[['Day 4 slide 12 ("See excel 1 - p1s3")','Set 3 P1 primary distribution','A 22,150; B 15,075; C 10,000; D 4,775'],['Day 4 slides 7–13','Production OH steps and bases','—']]},
P9:{plain:'Stores, maintenance and time-keeping do not make products, so their cost must be passed on to the production departments. The three methods differ only in how they treat service departments using each other.',
easy:['<b>Direct</b>: pretend service departments do not use each other. Split each service cost among the production departments only.','<b>Step</b>: close the service departments one by one, starting with the one that serves the most others. A closed department never receives cost again. New total = own cost + cost received.','<b>Reciprocal</b>: two service departments use each other, so each one\'s true cost depends on the other. Write two equations and solve: <b>E = (E₀ + a·F₀) ÷ (1 − a·b)</b>.','<b>Repeated distribution</b> gets the same answer: keep passing balances back and forth until nothing is left.','Check: total after distribution = total before.'],
vs:'Question says "ignore service-to-service" or gives no percentages between service departments → <b>direct</b>. Question gives a sequence → <b>step</b>. Question gives % that each service department gives to the other → <b>reciprocal</b>. Simple test: do two service departments both serve each other?',
ex:'Set 3 P4: E = 2,340 + 0.10F; F = 3,000 + 0.20E → E = 2,640 ÷ 0.98 = <b>2,693.88</b>; F = <b>3,538.78</b>. A = 8,000 + 0.20E + 0.25F = <b>9,423.47</b>.',
refs:[['Day 4 slide 33 ("See excel 1 - p2s3")','Set 3 P2, direct method','17,100 / 14,500 / 13,200'],['Day 4 slide 42 (p3s3)','Set 3 P3, step method','X 15,421; Y 10,579'],['Day 4 slide 49 (p4s3)','Set 3 P4, reciprocal','A 9,423.47; B 8,058.16; C 9,358.37'],['Day 4 slides 22–25','Single vs dual rate','—'],['Day 4 mini example (notes)','Direct / step / reciprocal compared','1,600 total each']]},
P10:{plain:'Several users share one facility, or several products share one selling price. You need a fair way to split the shared amount.',
easy:['<b>Stand-alone method</b>: each user\'s stand-alone cost ÷ total of stand-alone costs, times the shared cost.','<b>Incremental method</b>: rank the users. The first pays only its own stand-alone cost. The next pays the extra the group costs.','<b>Bundle price</b>: choose a weight (stand-alone selling price is the usual one). Share = bundle price × weight ÷ sum of weights.'],
vs:'Stand-alone is simple and fair-looking; incremental depends on who is ranked first. If the weights are not given, use selling price, then unit cost, then units.',
ex:'Phone plan: you alone 85, brother alone 75, joint 115. Stand-alone shares 47% / 53% → <b>54.05 / 60.95</b>. Incremental: brother 75, you 40.',
refs:[['Day 4 slides 52–56','Allocating common costs; Walk Through 14.7','54.05 / 60.95; 75 / 40; 57.50 each'],['Day 5 slides 3–10','Common cost, stand-alone, incremental; walk-throughs 14.7 and 14.8','—'],['Day 5 slides 11–12','Bundled products and revenue allocation','by selling price, unit cost or units']]},
P11:{plain:'A cost that is part fixed, part variable is hard to budget. These methods read the fixed part and the cost per unit from past data.',
easy:['<b>High-low</b>: pick the point with the highest <b>activity</b> and the point with the lowest activity (not the highest cost).','Variable cost per unit <b>m = change in cost ÷ change in activity</b>.','Fixed cost <b>b = cost − m × activity</b> (use either point).','<b>Regression</b>: the same line, but using all points. Excel: =SLOPE(costs, activity) and =INTERCEPT(costs, activity).','Predict with Y = mX + b. If usage changes, scale only the variable part.'],
vs:'High-low needs only two points and is quick but can mislead. Regression uses every point. A bill that already shows fixed and variable parts needs no estimation (account analysis).',
ex:'Day 5 deck: low (3, 9), high (12, 15). m = 6 ÷ 9 = <b>0.67</b>; b = 15 − 0.67 × 12 = <b>6.96</b>. Y = 0.67X + 6.96.',
refs:[['Day 5 slide 18','High-low method','m 0.67; b 6.96'],['Day 5 slides 19–21','Regression; Excel output','14.98 and 8,773.72'],['Day 5 (account analysis)','Water bill: 770 × 12 + 1,709 × 12','fixed + variable'],['Day 6 slides 69–100','Cheese Company cost formula','Y = 7.50X + 14,000']]},
P12:{plain:'The two methods treat fixed factory cost differently. Absorption puts it in product cost (so some sits in closing stock). Variable costing expenses it all in the year. So profits differ whenever stock changes.',
easy:['Absorption unit cost = variable cost + <b>fixed MOH ÷ units produced</b>.','Variable-costing unit cost = variable cost only.','Stock built up (produced > sold): absorption profit is <b>higher</b>.','<b>Difference = (produced − sold) × fixed MOH per unit.</b>','If produced = sold, both profits are the same.','Marginal cost = prime cost + variable overhead.'],
vs:'P3 finds the numbers under absorption. P12 compares absorption with variable costing. In Indian questions DL is often fixed, so leave it out of marginal cost.',
ex:'4,000 made, 3,800 sold, fixed MOH 50,000 → 12.50 a unit. Difference = 200 × 12.50 = <b>2,500</b> (5,500 vs 3,000). Closing stock 200 × 22.50 = 4,500 vs 200 × 10 = 2,000.',
refs:[['Day 5 slides 28–38','Absorption and variable costing; example','2,500 difference']]},
P13:{plain:'Contribution margin (CM) is what each unit adds toward fixed cost. Break-even is when total CM equals fixed cost. Everything else is a rearrangement of that one idea.',
easy:['<b>CM per unit</b> = price − variable cost. <b>CM ratio</b> = CM ÷ price.','Break-even <b>units</b> = fixed cost ÷ CM per unit.','Break-even <b>sales ₹</b> = fixed cost ÷ CM ratio.','Target profit: add it to fixed cost first: (FC + target) ÷ CM.','Target is <b>after tax</b>? Operating income = net income ÷ (1 − tax rate), then continue.','<b>Margin of safety</b> = budget − break-even. <b>Operating leverage</b> = CM ÷ OI; % change in profit = OL × % change in sales.'],
vs:'Units wanted → divide by CM per unit. Rupees wanted → divide by CM ratio. More than one product → P14. Something changes → P15.',
ex:'Tee Times: CM 600 − 400 = 200. BE = 50,000 ÷ 200 = <b>250</b>. Target NI 63,000 at 30% tax → OI 90,000 → (50,000 + 90,000) ÷ 200 = <b>700 sets</b> → sales <b>420,000</b>.',
refs:[['Day 5 slide 94','Tee Times','250; 700; 420,000'],['Day 5 slides 62–72','Coffee Klatch practice (CP 1–4)','CM 1.13; BE 1,150; 3,363 cups; 5,013'],['Day 5 slides 109–117','Margin of safety','950 cups'],['Day 5 slides 118–129','Operating leverage and cost structure','OL 2.21; +20% sales → +44.2%']]},
P14:{plain:'When a company sells several products, one break-even needs one average contribution. Weight each product\'s CM by how much of the mix it is.',
easy:['<b>Mix in units</b>: WACM = Σ (mix share × CM per unit).','Break-even units = fixed cost ÷ WACM. Split these units by the mix.','<b>Mix in sales rupees</b>: contribution of each = its sales × its CM ratio. Add them, subtract fixed cost.','Mix change: recompute with the new shares and compare profit.','The mix must hold: you cannot sell any 3,263 units, they must be in the ratio.'],
vs:'Units-based mix → WACM (per unit). Sales-based mix → CM ratios. One product only → P13.',
ex:'Savor the Flavor: 0.25 × 2.50 + 0.15 × 1.25 + 0.60 × 1.20 = WACM <b>1.5325</b>. BE = 5,000 ÷ 1.5325 = <b>3,263</b> units (816 / 489 / 1,958). The slide shows 3,247 from rounding.',

P15:{plain:'"What happens to profit if…?" Start from the base profit and recompute with the change. Only the numbers that change need new work.',
easy:['Write the base: price 500, variable 300, fixed 80,000, 500 units → profit 20,000.','Put in the change (price, variable cost, fixed cost, volume).','New profit = new units × new CM − new fixed cost.','Compare with 20,000: that is the gain or loss.','Shortcut when only volume and fixed cost change: <b>ΔProfit = ΔQ × CM − ΔFC</b>.'],
vs:'A price or variable-cost change affects the CM of <b>every</b> unit. A volume change affects only the extra units. A one-off order at a fixed price → P16.',
ex:'RBC: 540 units and 10,000 more advertising → 40 × 200 − 10,000 = <b>−2,000</b> (do not do it). v 310, Q 580: 580 × 190 − 80,000 = 30,200, <b>+10,200</b>.',

P16:{plain:'Should we accept an order or what is the lowest price? Only costs that change because of the order matter. Costs already there (fixed) are ignored unless the order uses up something valuable.',
easy:['Ask: <b>is capacity spare?</b>','Spare → minimum price = variable cost per unit + any new fixed cost of this order (tools, ads) + profit you want.','Full or scarce (e.g. labour hours) → add <b>opportunity cost</b>: the contribution you would lose from other work using the same hours.','Contribution per hour = CM per unit ÷ hours per unit. Opportunity cost = hours × that.','Accept only if the offer price is above total relevant cost.','Using spare capacity for a project (Eg 4): scale variable costs with sales, add new fixed costs, compare projects or the combination.'],
vs:'P15 changes the regular business. P16 is a one-off or extra-capacity decision. Spare capacity → no opportunity cost. Full capacity → opportunity cost.',
ex:'Eg 3: labour is scarce. Cost of order = DM + labour + variable OH 4,000 + opportunity cost 2,000 = <b>6,000</b> against price 5,500 → <b>reject</b>.',
refs:[['Day 5 slides 84–85','Eg 1 (recession, idle capacity) and Eg 2 (extra capacity)','Rs 9.50; Rs 11.2975'],['Day 5 slides 86–90','Special order; Eg 3 scarce labour','6,000 vs 5,500, reject'],['Day 6 slides 3 and 6','Eg 4: overseas contract vs local advertising','combination 1.75 lakh']]},
P17:{plain:'A master budget plans the whole year in a fixed order, because each budget feeds the next: sales decide production, production decides materials and labour, and all of them decide cash.',
easy:['<b>Production</b> = sales + wanted ending stock − beginning stock.','<b>Materials to buy</b> = production × kg per unit + wanted ending RM − beginning RM. Multiply by price.','<b>Labour</b>: hours needed; if workers are guaranteed hours, pay for the <b>larger</b> of needed and guaranteed.','<b>Overhead cash</b> = total overhead − depreciation (depreciation is not cash).','<b>Collections</b>: for each earlier month, % collected × that month\'s sales. Uncollectible is never collected.','<b>Cash budget</b>: beginning + receipts − payments. If below the minimum, borrow the shortfall; interest = amount × rate × months ÷ 12.'],
vs:'P17 builds the plan forward from sales. P18 compares actual with the plan after the event.',
ex:'Quattro June collections: 30% × 70,000 + 60% × 80,000 + 10% × 60,000 = 21,000 + 48,000 + 6,000 = <b>75,000</b>.',
refs:[['Day 6 slides 30–53','Breakers master budget worked example','sales, production, DM, DL, OH, cash, statements'],['Day 6 slides 58–59','Practice problems 1–9','2,040; 32,950; 49,200; 264,000; $183,750; $75,000; $46,000; $674,000; +$4,500'],['Day 6 (problem 10)','Gingham Company','$94,160 / $114,000 / $94,860 / $113,300'],['Day 6 (problem 11)','Tiara Company','42,200 / 47,150 / 43,350 / 132,700']]},
P18:{plain:'A static budget is set for one activity level. If actual activity is different, comparing against it is unfair. A flexed budget re-runs the plan at the actual activity.',
easy:['Split the budget into variable cost per unit and fixed cost.','<b>Flexed budget = variable rate × actual activity + fixed cost.</b> Fixed cost never flexes.','<b>Variance = actual − flexed budget.</b>','For a cost: actual above budget is <b>U</b> (unfavourable); below is <b>F</b>.','From two budget points, v = ΔY ÷ ΔX and F = Y − vX, then predict at any activity.'],
vs:'Static vs actual (same budget) → includes the effect of volume. Flexed vs actual → shows spending control only. Use flexed for judging managers.',
ex:'Young: v = 135,000 ÷ 30,000 = 4.50; fixed = 720,000. At 35,000 hours: 4.5 × 35,000 + 720,000 = <b>877,500</b>.',
refs:[['Day 6 slides 69–100','Cheese Company static and flexible budgets','Y = 7.50X + 14,000'],['Day 6 slide 101','Interspace (static) and Gridiron (flexed)','$8,700 U; $6,400 U'],['Day 6 slides 103–105','Trois Elles; Zin; Young','$3,000 F; E; Y = 4.5AH + 720,000 (B); 877,500 (A)']]},

function score(p){if(!query)return 0;const hay=(p.id+' '+p.n+' '+p.spot+' '+p.hook+' '+p.seen+' '+p.do.join(' ')).toLowerCase().replace(/<[^>]+>/g,'');const ws=query.toLowerCase().split(/\s+/).filter(Boolean);let s=0;for(const w of ws){if(hay.includes(w))s+=1;if(p.spot.toLowerCase().includes(w))s+=2;}return s}

function renderMap(){
 const sc=P.map(p=>score(p));const best=Math.max(0,...sc);
 let h='';const groups=grp?[grp]:Object.keys(G);
 for(const g of groups){
  h+=`<div class="gh" style="color:${col(g)}"><i style="background:${col(g)}"></i>${G[g].n}</div><div class="grid">`;
  for(const p of P.filter(p=>p.g===g)){const s=sc[P.indexOf(p)];const cls=query?(s>0&&s>=Math.max(1,best-1)?' hit':(s===0?' dim':'')):'';
   h+=`<button class="tile${cls}" data-p="${p.id}" style="--bgt:var(${G[g].t})"><span class="top"><span class="badge" style="background:${col(g)}">${p.id}</span><span class="nm">${p.n}</span></span><span class="hook">${p.hook}</span><span class="tr">${p.spot.split(', ').slice(0,3).join(' · ')}</span></button>`}
  h+='</div>'}
 $('#main').innerHTML=h;if(query){const t=document.querySelector('.tile.hit');if(t){t.style.scrollMarginTop='170px';t.scrollIntoView({block:'start'})}}}

{s:'Problem Set 1 · Problem 1',q:`Problem 1 : Cost sheet and profit or loss

Distribution dept. salaries & expenses 18000 | Office salaries and expenses 8600
Interest on borrowed fund 2000 | Dividend income 20000 (credit) | Bad debts 5000

1. Closing inventories: Raw materials Rs. 180000; WIP Rs. 192000 and FG Rs. 115000
2. Accrued Expenses: Direct Labour Rs. 8000; Indirect Labour Rs. 1200 and Interest on borrowed funds Rs. 2000

`<b>DM ladder.</b> Purchases 320,000 + freight 16,000 − returns 4,800 = 331,200. + opening 140,000 = <b>DM AFU 471,200</b>. − closing 180,000 = <b>DM used 291,200</b>.`,

`<b>Factory overhead</b> (split each common cost first):`+tb([['Item','Working','Rs'],['Indirect labour','18,000 + 1,200','19,200'],['Supervision','','10,000'],['Repairs and upkeep','','14,000'],['Heat, light, power','8/10 × 65,000','52,000'],['Rates and taxes','2/3 × 6,300','4,200'],['Misc. factory','','18,700'],['Depreciation plant','10% × 460,500','46,050'],['Depreciation building','4% × 200,000 × 8/10','6,400'],['<b>Factory OH</b>','','<b>170,550</b>']]),
`<b>Works cost gross = COP gross = TMC</b> = 509,200 + 170,550 = <b>679,750</b>.`,
`<b>WIP ladder.</b> + opening 200,000 = WIP AFU 879,750; − closing 192,000 = <b>COGM (works cost net) 687,750</b>.`,
`<b>FG ladder.</b> + opening 80,000 = FG AFS 767,750; − closing 115,000 = <b>COGS 652,750</b>.`,
`<b>Non-manufacturing cost.</b> Admin: 6,500 + 2,100 + 8,600 + 800 + 875 (5% × 17,500) = <b>18,875</b>. Selling and distribution: 6,500 + 33,600 + 11,000 + 22,500 + 18,000 + 800 = <b>92,400</b>. Total = <b>111,275</b>.`,
`<b>Profit.</b> Net sales = 768,000 − 14,000 = 754,000. Gross margin = 754,000 − 652,750 = 101,250. Less 111,275 = <b>loss 10,025</b>.`,
`<i>Solution-file layout:</i> works cost net 687,750 + admin 18,875 = cost of production 706,625; +80,000 − 115,000 = 671,625; + selling and distribution 92,400 = <b>cost of sales 764,025</b>; 754,000 − 764,025 = loss 10,025. Same loss.`],

{s:'Problem Set 1 · Problem 3',q:`Problem 3: Cost sheet with adjustments for inventories

`<b>WIP:</b> + 4,000 − 6,000. <b>Works cost net</b> = <b>214,500</b>.`,`<b>Admin OH</b> = 10% × works cost 214,500 = 21,450. <b>COGM (cost of production)</b> = 235,950.`,`<b>FG:</b> + 8,000 − 7,000. <b>COGS</b> = <b>236,950</b>.`,`<b>Selling OH</b> = 5% × 275,000 = 13,750. <b>Cost of sales</b> = 250,700.`,`<b>Profit</b> = 275,000 − 250,700 = <b>24,300</b>.`,`<i>Alternative (admin as period cost):</i> COGM 214,500 → COGS 215,500 + selling 13,750 + admin 21,450 = 250,700. Same profit.`],

{s:'Problem Set 1 · Problem 4',q:`Problem 4: Cost of sales and profit determination

{s:'Day 3 slides · Class example (the factory funnel), Day 1 and Day 2',q:`Day 1.  Direct materials: opening 0; purchase 400; freight 50; return 25; closing 225.  Direct labour 100.  MOH 50.  Work in process: opening 0; completed (COGM) 275.  Finished goods: opening 0; closing 50.

Production in the current year was 1 lac units; 2 kg of DM is used to make 1 unit of FG. Revenue were Rs 436800. The FG inventory ending is at average unit manufacturing cost for the current year and was Rs 20970. Calculate period ending DM inventory cost; period ending FG inventory in units; SP per unit; operating income`,
st:[`<b>Step 1 (DM).</b> DM used = 100,000 × 2 = 200,000 kg; bought 202,000 kg. The Rs 1.4 lacs is the cost of DM <b>used</b>, so Rs 0.70 a kg. <b>Closing DM = 2,000 × 0.70 = Rs 1,400</b>.`,
`<b>Step 2 (unit manufacturing cost).</b> 140,000 + 30,000 + 5,000 + (10,000 + 16,000) + (8,000 + 24,000) = <b>233,000</b>; per unit = 233,000 / 100,000 = <b>2.33</b>.`,
`<b>Step 3 (FG units).</b> 20,970 / 2.33 = <b>9,000 units</b>. Units sold = 100,000 − 9,000 = <b>91,000</b>.`,
`<b>Step 4.</b> Selling price = 436,800 / 91,000 = <b>Rs 4.80</b>.`,
`<b>Step 5 (income statement).</b> COGS = 233,000 − 20,970 = 212,030. GM = 436,800 − 212,030 = 224,770. Variable marketing = 91,000 × 1.35 = 122,850 (it follows units <b>sold</b>). Fixed marketing 40,000; admin 50,000.`,
`<b>Operating income</b> = 224,770 − 122,850 − 40,000 − 50,000 = <b>11,920</b>.`],
a:'Closing DM Rs 1,400 · FG 9,000 units · SP Rs 4.80 · Operating income Rs 11,920'},
{s:'Problem Set 2 · Q3',q:`If in the above problem, Indirect other manufacturing costs are not inventoriable cost and there are 9000 units of FG inventory on Dec 31. Then, calculate FG inventory ending total cost, and operating income of the year`,
st:[`Indirect other = 8,000 + 24,000 = <b>32,000</b>. It is a period cost, expensed now.`,`<b>Inventoriable manufacturing cost</b> = 233,000 − 32,000 = 201,000; per unit = <b>2.01</b>.`,`<b>FG ending cost</b> = 9,000 × 2.01 = <b>Rs 18,090</b>. <b>COGS</b> = 201,000 − 18,090 = 182,910.`,
`<b>Operating income</b> = 436,800 − 182,910 = 253,890; less 32,000 (period), marketing 162,850 (122,850 + 40,000), admin 50,000 = <b>9,040</b>.`,`<b>Check:</b> 11,920 − 9,040 = 2,880 = 9,000 × (2.33 − 2.01).`],
a:'FG ending cost Rs 18,090 · Operating income Rs 9,040'}
];

{s:'Problem Set 1 · Problem 2',q:`Problem 2: Cost statement, estimated cost and Price
The accounts of Steelsways Engineering Co. Ltd show the following for 2013:
Materials used Rs. 180000 | Manual and machine labour wages directly chargeable 160000 | Works overhead expenditure 40000 | Establishment and general expenses 19000

a. Show the works cost and total cost, the percentage that the works overhead cost bears to the manual and machine labour wages and the percentage that the establishment and general expenses bear to the works cost
b. What price should the company quote to manufacture a machine which, it is estimated, will require an expenditure of Rs 8000 on materials; and Rs. 6000 on wages, so that it will yield a profit of 25% on the total cost or 20% on selling price`,
st:[`<b>(a) Works cost</b> = 180,000 + 160,000 + 40,000 = <b>380,000</b>. <b>Total cost</b> = 380,000 + 19,000 = <b>399,000</b>.`,`<b>Works OH % of wages</b> = 40,000 / 160,000 = <b>25%</b>. <b>E&amp;G % of works cost</b> = 19,000 / 380,000 = <b>5%</b>.`,
`<b>(b) Machine.</b> Prime cost = 8,000 + 6,000 = 14,000. Works OH = 25% × 6,000 = 1,500. Works cost = 15,500. E&amp;G = 5% × 15,500 = 775. <b>Total cost 16,275</b>.`,`<b>Profit 25% on cost:</b> 16,275 × 1.25 = <b>20,343.75</b>.`,`<b>Check, 20% on selling price:</b> 16,275 / 0.80 = 20,343.75. Same, because 25% on cost = 20% on price.`],
a:'Works cost 380,000 · Total cost 399,000 · 25% · 5% · Quote Rs 20,343.75'}
];

{s:'Day 3 · Gross margin vs contribution margin statements (class example)',q:`Sales 1,000.  Variable costs: product (manufacturing) 250 and period (non-manufacturing) 270.  Fixed costs: product 160 and period 138.  Prepare the gross margin statement and the contribution margin statement.`,
st:[`<b>Gross margin format (by function):</b> COGS = variable product 250 + fixed product 160 = 410. GM = 1,000 − 410 = <b>590</b>.`,`Less non-manufacturing (selling + admin) = 270 + 138 = 408. <b>Operating profit = 182</b>.`,`<b>Contribution format (by behaviour):</b> variable = 250 + 270 = 520. CM = 1,000 − 520 = <b>480</b>. Less fixed 160 + 138 = 298. <b>Operating profit = 182</b>.`,`Same profit, two layouts. Professor's P&amp;L order: Sales − COGS = GM − sales expenses − admin expenses = OP.`],

{s:'Day 3 · Now You Do It: Solomon Grundy Corp.',q:`Solomon Grundy Corp. has no opening stocks.
Tuesday: bought raw material Rs 10,000 for cash.
Wednesday: Rs 3,600 of direct material moved to production.
Thursday: direct labour Rs 2,500.
Friday: manufacturing overhead Rs 800.
Saturday: finished 80% of production.
Sunday: sold 70% of what was finished.
(b) Balances in RM, WIP and FG on Saturday.  (c) COGS on Sunday.`,
st:[`<b>Tue:</b> RM = 10,000.`,`<b>Wed:</b> RM = 10,000 − 3,600 = 6,400; WIP = 3,600.`,`<b>Thu:</b> WIP = 3,600 + 2,500 = 6,100.`,`<b>Fri:</b> WIP = 6,100 + 800 = 6,900.`,`<b>Sat:</b> 80% finished. COGM = 0.8 × 6,900 = <b>5,520</b> into FG; WIP left = 6,900 − 5,520 = <b>1,380</b>.`,`<b>Sun:</b> COGS = 0.7 × 5,520 = <b>3,864</b>; FG left = 5,520 − 3,864 = <b>1,656</b>.`],

{s:'Practice problem · PlayCraft Inc.',q:`PlayCraft Inc. manufactures wooden educational toys by transforming purchased and recycled wood into finished products. The following transactions occurred during the year (in no particular order):
1. Purchased a new woodworking machine for Rs.4,00,000, with an estimated life of 5 years, used exclusively for the business.
2. Purchased new wooden boards for Rs.2,40,000 and collected recycled wood from local furniture shops at no cost.
3. Purchased paints, glue, screws and other production supplies for Rs. 60,000. All of these supplies were used during the year.
4. Paid workers Rs.1,50,000 to cut, shape, assemble, and finish the wooden toys.
5. Purchased office furniture for Rs. 80,000 for use by the company's administrative staff.
6. Paid Rs. 40,000 for electricity and other utilities relating to the factory.
7. Paid Rs. 25,000 for repairs and maintenance of the woodworking machinery.
8. Paid Rs. 45,000 to transport completed toys to customers. The transportation was incurred after the toys were completed and sold.
9. Paid Rs.35,000 for online advertising and promotional campaigns.
10. Depreciation on the woodworking machine for the year was Rs.36,000.
11. Depreciation on the office furniture for the year was Rs.8,000.
12. Paid factory supervisor salaries of Rs.50,000.
13. Beginning raw materials inventory Rs. 75,000.  14. Beginning WIP Rs. 20,000.  15. Beginning FG Rs. 60,000.
16. At year-end, one batch of toys remained partially completed; manufacturing costs accumulated in it Rs. 30,000.
17. At year-end, raw materials costing Rs. 45,000 remained unused.
18. All other toys were completed and sold to customers for Rs. 12,00,000.
19. Rs. 70,000 of completed toys remained in finished goods at year-end.
20. Paid Rs. 20,000 in salaries to administrative staff.
(a) Raw materials, WIP and FG T-accounts  (b) direct material consumed, total manufacturing costs, COGM, COGS  (c) traditional income statement  (d) which costs rise with production, and why it helps management`,
st:[`<b>Tag each item first.</b> Machine (1) and furniture (5) are <b>assets</b>: only their depreciation (10, 11) counts. Boards (2) = DM. Supplies (3) = indirect material. Workers (4) = DL. Utilities (6), repairs (7), supervisor (12), machine depreciation (10) = MOH. Transport (8), advertising (9), office depreciation (11), admin salaries (20) = period costs.`,
`<b>Raw materials T-account.</b> Opening 75,000 + boards 240,000 + supplies 60,000 = 375,000 available. Closing 45,000. Used = 330,000 = DM <b>270,000</b> + indirect material 60,000.`,
`<b>MOH</b> = 60,000 + 50,000 + 36,000 + 25,000 + 40,000 = <b>211,000</b>.`,`<b>WIP T-account.</b> 20,000 + DM 270,000 + DL 150,000 + MOH 211,000 = 651,000 AFU. Closing 30,000. <b>COGM = 621,000</b>. Total manufacturing cost = 270,000 + 150,000 + 211,000 = <b>631,000</b>.`,
`<b>FG T-account.</b> 60,000 + 621,000 = 681,000. Closing 70,000. <b>COGS = 611,000</b>.`,
`<b>(c) Income statement.</b> Sales 1,200,000 − COGS 611,000 = <b>gross profit 589,000</b>. Less freight 45,000, depreciation (office) 8,000, admin salaries 20,000, advertising 35,000 = 108,000. <b>Operating profit = 481,000</b>.`,
`<b>(d)</b> Variable (rise with output): DM, DL if piece-rate, supplies, often electricity. Fixed in the short run: machine depreciation 36,000, supervisor 50,000. It helps because management can estimate the extra cost of more output and see cost per unit fall as fixed cost spreads.`],
a:'DM consumed 270,000 · Total manufacturing cost 631,000 · COGM 621,000 · COGS 611,000 · Gross profit 589,000 · Operating profit 481,000'}
];

{s:'Problem Set 3 · Problem 1 (primary distribution)',q:`Problem 1: for Method of primary distribution
ABC Ltd is divided into four departments: A, B, C as production departments and D as service departments. The actual costs for a given period are as follows:

Information with respect to the four departments (Dept A, B, C, D):
Area (sq ft): 1500, 1100, 900, 500
No. of employees: 20, 15, 10, 15
Horse power of machines: 800, 500, 200, ---
Total wages: 60000, 40000, 30000, 20000
Value of plant: 240000, 180000, 120000, 60000
Value of stock: 150000, 90000, 60000, ---
Light points (nos.): 40, 30, 20, 10

Apportion the costs by most equitable method`,

`<b>Step 2. Write the ratio, strike common zeros, simplify:</b> area 1500:1100:900:500 = 15:11:9:5 (40). Plant 240:180:120:60 = 4:3:2:1 (10). Wages 6:4:3:2 (15). Stock 150:90:60 = 5:3:2 (10). HP 8:5:2 (15). Light 4:3:2:1 (10). Employees 4:3:2:3 (12).`,

`<b>Step 4. Check.</b> The columns add to 52,000. D has no stock and no HP, so it gets nil on those.`,
`<b>Rate method (professor: do it both ways).</b> Rent rate = 10,000 / 4,000 sq ft = Rs 2.50; A = 1,500 × 2.50 = 3,750. Same.`],

{s:'Problem Set 3 · Problem 2 (direct method)',q:`Problem 2: for method of direct redistribution

Service departments: Stores 2000 | Time keeping & accounts 1500 | Power 800 | canteen 500 (total 4800)    Total 44800

{s:'Problem Set 3 · Problem 3 (step method)',q:`Problem 3: for step method

{s:'Problem Set 3 · Problem 4 (reciprocal method)',q:`Problem 4: for reciprocal method
ABC Ltd has three production departments A, B, C and two service departments E and F. Primary distribution: A 8000 | B 6500 | C 7000 | E 2340 | F 3000 (total 26840).
Service departments are charged out as follows (to A, B, C, E, F):
E: 20%, 25%, 35%, --, 20%
F: 25%, 25%, 40%, 10%, --
Distribute the service department costs to the production departments by (i) repeated distribution and (ii) simultaneous equations.`,
st:[`<b>Method 1: repeated distribution (cycles).</b> Pass each balance out by the percentages and repeat until it is negligible.`,
tb([['Cycle','Distribute','A','B','C','Left'],['Start','','8,000','6,500','7,000','E 2,340; F 3,000'],['1','E 2,340','8,468','7,085','7,819','F 3,468'],['2','F 3,468','9,335','7,952','9,206.2','E 346.8'],['3','E 346.8','9,404.36','8,038.70','9,327.58','F 69.36'],['4','F 69.36','9,421.70','8,056.04','9,355.32','E 6.94'],['5','E 6.94','9,423.09','8,057.77','9,357.75','F 1.39'],['<b>Final</b>','','<b>≈9,423</b>','<b>≈8,058</b>','<b>≈9,358</b>','']]),
`<b>Method 2: simultaneous equations (exact).</b> Let E and F be the true costs. E = 2,340 + 0.10 F and F = 3,000 + 0.20 E.`,`Substitute: E = 2,340 + 0.10 (3,000 + 0.20 E) = 2,640 + 0.02 E. So 0.98 E = 2,640 and <b>E = 2,693.88</b>. Then <b>F = 3,000 + 0.20 × 2,693.88 = 3,538.78</b>.`,
`<b>Distribute true costs.</b> A = 8,000 + 20% E + 25% F = 8,000 + 538.78 + 884.69 = <b>9,423.47</b>. B = 6,500 + 673.47 + 884.69 = <b>8,058.16</b>. C = 7,000 + 942.86 + 1,415.51 = <b>9,358.37</b>.`,`Check: 9,423.47 + 8,058.16 + 9,358.37 = 26,840.`],
a:'A 9,423.47 · B 8,058.16 · C 9,358.37 (E = 2,693.88, F = 3,538.78)'},
{s:'Day 4 · Mini example for the three methods (class)',q:`Service S1 costs 1,000 and S2 costs 600. S1's services are used: S2 20%, P1 40%, P2 40%. S2's services are used: S1 10%, P1 50%, P2 40%. P1 and P2 are production departments. Allocate by the direct, step and reciprocal methods.`,

{s:'Day 4 · Walk Through 14.7 and Day 5 · Walk Through 14.8 (phone plan)',q:`Allocating common costs. Your brother's own plan would cost 75. Your own plan would cost 85. The joint plan (family plan) costs 115 in total.
14.7: allocate the 115 by the stand-alone method.
14.8: allocate the 115 by the incremental method (the brother is the primary user, and then you as primary user).`,
st:[`<b>Stand-alone (14.7).</b> Step 1: stand-alone costs 75 + 85 = 160.`,`Step 2: weights. Brother 75/160 = 47%; you 85/160 = 53%.`,`Step 3: share the actual common cost in those weights. Brother 47% × 115 = <b>54.05</b>; you 53% × 115 = <b>60.95</b>. Total 115. Both save.`,
`<b>Incremental (14.8), brother primary.</b> Step 1: rank the users. Step 2: primary user pays his stand-alone cost: brother <b>75</b>. Step 3: the next user pays the extra: you 115 − 75 = <b>40</b>.`,`<b>Incremental, you primary.</b> You 85; brother 115 − 85 = <b>30</b>.`,`Brother objects to paying the same and getting no saving, so the two compromise at 57.50 each.`,`The slide rounds the weights to 47% / 53%. Exact fractions give 53.91 / 61.09. Use the rounding your professor shows.`],
a:'Stand-alone: brother 54.05, you 60.95 · Incremental (brother first): 75 and 40 · (you first): 85 and 30'}
];

{s:'Day 5 · Account analysis (Dover Manufacturing water bill)',q:`Dover Manufacturing's water bill: a meter base fee of $770 (fixed) and $1,709 for 1,220 units of water used (variable) this month. Estimate the water cost for a year. What if next year it uses 10% less water?`,
st:[`<b>Method 1, account analysis: read the bill and judge fixed vs variable.</b>`,`Fixed for a year = 770 × 12 = <b>9,240</b>.`,`Variable for a year (every month average) = 12 × 1,709 = 20,508. Total = <b>29,748</b>.`,`10% less water: fixed stays 9,240; variable = 90% × 1,709 × 12 = 18,457.20. Total = <b>27,697.20</b>.`],

{s:'Day 5 · High-low method',q:`Deck example: the lowest activity point is (3, $9) and the highest is (12, $15). Find the cost equation Y = mX + b.
Dover data: the highest is 450 machine hours with $15,000 and the lowest is 150 hours with $10,800. Find m and b.`,
st:[`<b>Step 1.</b> Pick the highest and lowest activity (X) with their costs (Y).`,`<b>Step 2. Slope</b> m = (Y high − Y low) / (X high − X low) = (15 − 9)/(12 − 3) = <b>0.67</b>.`,`<b>Step 3.</b> Put one point in Y = mX + b: 15 = 0.67 × 12 + b, so <b>b = 6.96</b>. Equation: <b>Y = 0.67 X + 6.96</b>.`,`<b>Dover:</b> m = (15,000 − 10,800)/(450 − 150) = <b>$14.00</b> per hour. b = 10,800 − 14 × 150 = <b>$8,700</b>.`,`High-low uses only two points, so an odd month can distort it.`],
a:'Y = 0.67X + 6.96 · Dover: m = $14.00 per hour, b = $8,700'},
{s:'Day 5 · Regression (Xavier Company, 13 months)',q:`Machine hours (col A): 193, 239, 450, 150, 275, 394, 259, 414, 437, 226, 266, 428, 385.

Use regression to find the cost equation.`,
st:[`<b>Excel steps:</b> turn on the Analysis ToolPak. Data tab → Data Analysis → Regression → OK.`,`Input Y Range = cost column (B1:B14). Input X Range = machine hours column (A1:A14). Tick Labels. New Worksheet Ply. OK.`,`<b>Read the output.</b> Intercept coefficient 8,773.72 = fixed cost b. Machine Hours coefficient 14.98 = variable cost per hour m. R Square 0.65.`,`<b>Equation: Y = 14.98 X + 8,773.72.</b> Without the ToolPak: =SLOPE(B2:B14, A2:A14), =INTERCEPT(B2:B14, A2:A14), =RSQ(...).`,`Regression 14.98 and high-low 14.00 differ because regression uses all 13 points.`],
