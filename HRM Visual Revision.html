<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HRM Visual Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with mode tabs + module rail; a responsive grid of diagram cards; flashcard and quiz views share the same data. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --ink:#16212E; --muted:#5A6676; --line:#D7DEE7;
  --accent:#0E7C74; --accent2:#C2410C; --good:#2F855A; --bad:#C53030; --warn:#B7791F;
  --soft:#E1F1EF; --soft2:#FBEADC; --soft3:#EEF1F6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --text:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161F2A; --ink:#E5EBF1; --muted:#9AA6B5; --line:#2A3542;
  --accent:#3BC1B2; --accent2:#F0894A; --good:#5CC98A; --bad:#F07272; --warn:#E2B04A;
  --soft:#123330; --soft2:#3A2415; --soft3:#1D2733; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161F2A; --ink:#E5EBF1; --muted:#9AA6B5; --line:#2A3542;
  --accent:#3BC1B2; --accent2:#F0894A; --good:#5CC98A; --bad:#F07272; --warn:#E2B04A;
  --soft:#123330; --soft2:#3A2415; --soft3:#1D2733; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px 10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--soft3);padding:3px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 13px var(--text);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{flex:1 1 200px;max-width:280px;min-width:0}
.search input{width:100%;font:14px var(--text);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:thin}
.rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 12.5px var(--text);padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.rail button .pc{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.rail button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rail button[aria-pressed="true"] .pc{color:inherit;opacity:.75}
.rail .sep{flex:0 0 auto;align-self:center;font:700 11px var(--text);letter-spacing:.08em;color:var(--accent2);padding:0 2px 0 6px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 48px}
.mhead{display:flex;flex-wrap:wrap;align-items:end;gap:6px 14px;margin:22px 0 10px}
.mhead:first-child{margin-top:0}
.mhead h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.mhead .tag{font:700 11px var(--text);letter-spacing:.08em;color:var(--accent2);text-transform:uppercase}
.mhead .prog{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.meter{width:90px;height:6px;border-radius:9px;background:var(--soft3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.done{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.chead{display:flex;align-items:start;gap:8px}
.chead h3{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;margin:0;flex:1;text-wrap:balance}
.chead .src{font-size:11px;color:var(--muted);display:block;font-family:var(--text);font-weight:500;margin-top:2px}
.tick{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;font:600 11px var(--text);padding:4px 9px;cursor:pointer}
.card.done .tick{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.kw{font-size:12.5px;color:var(--muted);margin:0}
.kw b{color:var(--ink);font-weight:600}
details.eg{font-size:12.5px;border-top:1px dashed var(--line);padding-top:8px}
details.eg summary{cursor:pointer;color:var(--accent2);font-weight:600;list-style:none}
details.eg summary::-webkit-details-marker{display:none}
details.eg summary::before{content:"+ ";}
details.eg[open] summary::before{content:"− ";}
details.eg p{margin:6px 0 0}
/* ---- viz parts ---- */
.viz{min-width:0}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{flex:1 1 90px;min-width:0;background:var(--soft);border-radius:8px;padding:7px 8px;position:relative}
.step .n{font:700 10.5px var(--text);color:var(--accent);letter-spacing:.05em}
.step .l{font-weight:700;font-size:12.5px;line-height:1.2}
.step .t{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.step .f{margin-top:5px;font-size:11px;font-weight:600;color:var(--bad)}
.step.win{background:var(--accent);color:var(--surface)}
.step.win .t,.step.win .n{color:inherit;opacity:.85}
.step.win .f{color:var(--surface)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.chips.c3{grid-template-columns:repeat(auto-fill,minmax(95px,1fr))}
.chip{background:var(--soft3);border-radius:8px;padding:7px 8px;min-width:0}
.chip .l{font-weight:700;font-size:12.5px;line-height:1.2}
.chip .t{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.chip.hl{background:var(--soft2)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.col{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.col h4{margin:0 0 5px;font:700 12.5px var(--text);color:var(--accent)}
.col:nth-child(2) h4{color:var(--accent2)}
.col:nth-child(3) h4{color:var(--warn)}
.col ul{margin:0;padding-left:15px;font-size:12px}
.col li{margin:1px 0}
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px;font-size:12px}
.matrix .ax{font:700 10.5px var(--text);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.matrix .ay{writing-mode:vertical-rl;transform:rotate(180deg);max-width:22px}
.matrix .cell{background:var(--soft3);border-radius:8px;padding:8px;min-width:0}
.matrix .cell .l{font-weight:700;font-size:13px}
.matrix .cell .t{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.matrix .cell.hl{background:var(--accent);color:var(--surface)}
.matrix .cell.hl .t{color:inherit;opacity:.85}
.matrix .cap{grid-column:2/4;text-align:center;font-size:11px;color:var(--muted)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyr .lv{background:var(--accent);color:var(--surface);border-radius:6px;padding:5px 8px;text-align:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;max-width:100%}
.pyr .rt{font-size:11px;color:var(--accent2);font-weight:700}
.ladder{display:flex;flex-direction:column;gap:4px}
.rung{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:stretch}
.rung .b{border-radius:6px;display:flex;align-items:center;justify-content:center;font:800 14px var(--display);color:#fff}
.rung .x{background:var(--soft3);border-radius:6px;padding:5px 8px;min-width:0}
.rung .x .l{font-weight:700;font-size:12.5px}
.rung .x .t{font-size:11.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:12px}
.barrow .track{background:var(--soft3);border-radius:6px;height:20px;position:relative;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:6px}
.barrow .val{position:absolute;inset:0 6px 0 auto;display:flex;align-items:center;font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:11.5px}
.tbl th{background:var(--ink);color:var(--surface);text-align:left;padding:4px 6px;font-weight:600}
.tbl td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.cyc{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1.35}
.cyc svg{position:absolute;inset:0;width:100%;height:100%}
.cyc .node{position:absolute;transform:translate(-50%,-50%);width:38%;background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;padding:4px 6px;text-align:center}
.cyc .node .l{font-weight:700;font-size:12px;line-height:1.15}
.cyc .node .t{font-size:10.5px;color:var(--muted);line-height:1.2}
.cyc .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 11px var(--text);color:var(--accent2);text-align:center;width:30%}
svg.plot{width:100%;height:auto;display:block}
svg .axis{stroke:var(--line);stroke-width:1}
svg .axl{fill:var(--muted);font:10px var(--text)}
svg .lbl{fill:var(--ink);font:600 10px var(--text)}
svg .lbl.m{fill:var(--muted);font-weight:500}
svg .ln{fill:none;stroke-width:2.4;stroke-linecap:round}
svg .s-a{stroke:var(--accent)} svg .s-b{stroke:var(--accent2)} svg .s-g{stroke:var(--good)} svg .s-r{stroke:var(--bad)} svg .s-m{stroke:var(--muted)}
svg .d-a{fill:var(--accent)} svg .d-b{fill:var(--accent2)} svg .d-g{fill:var(--good)} svg .d-r{fill:var(--bad)} svg .d-m{fill:var(--muted)}
svg .dash{stroke-dasharray:5 4}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.empty{padding:40px 0;color:var(--muted);text-align:center}
/* ---- flashcards ---- */
.fc-tools,.qz-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select,.btn{font:600 13px var(--text);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.warn{background:var(--soft2);border-color:transparent}
.fc-stage{max-width:620px;margin:0 auto}
.flip{perspective:1200px;cursor:pointer;width:100%;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:inherit}
.flip .inner{position:relative;width:100%;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface)}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .mod{font:700 11px var(--text);letter-spacing:.08em;color:var(--accent2);text-transform:uppercase}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,34px);line-height:1.1;text-wrap:balance}
.face .def{font-size:17px;line-height:1.45}
.face .hint{font-size:12px;color:var(--muted);margin-top:auto}
.fc-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.fc-count{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.flip .inner{transition:none}}
/* ---- quiz ---- */
.qz{max-width:680px;margin:0 auto}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.qcard .qn{font:700 11px var(--text);letter-spacing:.08em;color:var(--accent2);text-transform:uppercase}
.qcard .qq{font-size:17px;margin:8px 0 14px;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:600 14px var(--text);padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good)}
.opt.no{background:color-mix(in srgb,var(--bad) 16%,var(--surface));border-color:var(--bad)}
.opt:disabled{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.qfoot .sc{margin-right:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.qres{text-align:center;padding:30px 10px}
.qres .big{font-family:var(--display);font-size:46px;font-weight:800;color:var(--accent)}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>HRM Visual Revision</h1><span>14 modules · infographics, flashcards, quiz</span></div>
      <div class="search"><input id="q" type="search" placeholder="Search topics or keywords" aria-label="Search topics"></div>
      <div class="tabs" role="group" aria-label="Mode">
        <button id="m-info" aria-pressed="true">Infographics</button>
        <button id="m-flash" aria-pressed="false">Flashcards</button>
        <button id="m-quiz" aria-pressed="false">Quiz</button>
      </div>
    </div>
    <nav class="rail" id="rail" aria-label="Modules"></nav>
  </div>
</header>

<main class="wrap">
  <section id="v-info"></section>
  <section id="v-flash" hidden>
    <div class="fc-tools">
      <select id="fc-mod" aria-label="Flashcard module"></select>
      <button class="btn" id="fc-shuf">Shuffle</button>
      <button class="btn" id="fc-weak">Only cards to review</button>
    </div>
    <div class="fc-stage">
      <button class="flip" id="flip" aria-label="Flip card">
        <div class="inner">
          <div class="face front"><div class="mod" id="fc-m1"></div><div class="term" id="fc-term"></div><div class="hint">Tap the card or press Space to see the meaning</div></div>
          <div class="face back"><div class="mod" id="fc-m2"></div><div class="def" id="fc-def"></div><div class="hint">Do you know it?</div></div>
        </div>
      </button>
      <div class="fc-nav">
        <button class="btn" id="fc-prev">Previous</button>
        <button class="btn warn" id="fc-again">Review again</button>
        <button class="btn pri" id="fc-know">I know this</button>
        <button class="btn" id="fc-next">Next</button>
      </div>
      <div class="fc-count" id="fc-count"></div>
    </div>
  </section>
  <section id="v-quiz" hidden>
    <div class="qz">
      <div class="qz-tools">
        <select id="qz-mod" aria-label="Quiz module"></select>
        <select id="qz-n" aria-label="Number of questions"><option value="10">10 questions</option><option value="20">20 questions</option><option value="30">30 questions</option></select>
        <button class="btn pri" id="qz-start">Start new quiz</button>
      </div>
      <div id="qz-box"></div>
    </div>
  </section>
</main>

<script>
/* ===================== DATA ===================== */
const MODS = [
 {id:"a1",p:"A",n:"Strategic HRM",s:"Prof. Prantika Ray · S1–2"},
 {id:"a2",p:"A",n:"Recruitment & Selection",s:"Prof. Prantika Ray · S3–4"},
 {id:"a3",p:"A",n:"International HRM",s:"Prof. Prantika Ray · Expats to digital nomads"},
 {id:"a4",p:"A",n:"Mentoring & Coaching",s:"Prof. Prantika Ray"},
 {id:"a5",p:"A",n:"Learning & Development",s:"Prof. Prantika Ray · S9–10"},
 {id:"a6",p:"A",n:"Job Evaluation",s:"Prof. Prantika Ray · Point method"},
 {id:"b1",p:"B",n:"Intro to HRM",s:"Prof. Anjana Karumathil · S1"},
 {id:"b2",p:"B",n:"Strategic HRM (B)",s:"Prof. Anjana Karumathil · S2"},
 {id:"b3",p:"B",n:"Recruitment (B)",s:"Prof. Anjana Karumathil · S3"},
 {id:"b4",p:"B",n:"Talent Development",s:"Prof. Anjana Karumathil · S4"},
 {id:"b5",p:"B",n:"Performance Mgmt",s:"Prof. Anjana Karumathil · S5"},
 {id:"b6",p:"B",n:"Industrial Relations",s:"Prof. Anjana Karumathil · S6"},
 {id:"b7",p:"B",n:"Sexual Harassment",s:"Prof. Anjana Karumathil · Reardon's spectrum"},
 {id:"b8",p:"B",n:"Ethics in HRM",s:"Prof. Anjana Karumathil · S8"}
];

const C = []; // cards
function card(m,t,v,k,eg,src){C.push({id:m+"-"+C.length,m,t,v,k,eg,src})}

/* ---------- A1 STRATEGIC HRM ---------- */
card("a1","HR as competitive advantage",{type:"compare",cols:[{h:"Old view",items:["HR = admin & paperwork","Cost centre","Carries out strategy set elsewhere"]},{h:"Strategic HRM",items:["People = edge over rivals","Strategic asset","HR helps create strategy"]}]},
 "<b>Competitive advantage</b> = what lets a firm beat rivals. Machines can be bought; skilled, motivated people can't be copied.","Two airlines fly the same aircraft; the one with better-trained crew wins customers.");
card("a1","Resource-Based View (RBV)",{type:"steps",items:[{l:"Firm resources",t:"What you have: people, know-how, brand"},{l:"Distinctive capabilities",t:"What you do especially well"},{l:"Sustained competitive advantage",t:"A lead rivals can't close",win:1}]},
 "<b>Barney (1991)</b>, J. of Management. Advantage comes from <b>inside</b> the firm, not only market position. People, culture, routines = <b>strategic assets</b>.","A 50-year-old sweet shop wins on its trained halwais and recipes, not its oven.","Barney 1991");
card("a1","VRIO — four gates",{type:"steps",gate:1,items:[{l:"Valuable?",t:"Uses opportunity / beats threat",f:"No → disadvantage"},{l:"Rare?",t:"Few rivals have it",f:"No → parity"},{l:"Inimitable?",t:"Costly to copy",f:"No → temporary edge"},{l:"Organised?",t:"Firm set up to use it",f:"Yes to all → sustained",win:1}]},
 "Ask in order; a resource must pass <b>all four</b> for sustained advantage.","ATMs: valuable, not rare (parity). Tata's 150-year trust culture + HR systems: passes all four.");
card("a1","The five strategic fits",{type:"chips",items:[{l:"Environmental",t:"HR ↔ outside world: social, cultural, institutional (laws, unions)"},{l:"Vertical (strategic)",t:"HR ↔ business strategy, mission, vision, goals"},{l:"Internal organisational",t:"HR ↔ technology, structure, work systems, culture"},{l:"Intra-function",t:"HR practices support, not contradict, each other"},{l:"Intra-activity",t:"Consistency inside one practice (e.g. all pay parts)"}]},
 "Fit = <b>alignment</b>. Fits decide if HR <b>reinforces or undermines</b> strategy. Order: outside → top → inside → within HR → within one activity.","Training teamwork but ranking individuals for bonus = poor intra-function fit.");
card("a1","Integrative model → 4 HR strategies",{type:"matrix",x:["Outcome control","Process control"],y:["Internal (make)","External (buy)"],xt:"Locus of workplace control",cells:[[{l:"Commitment",t:"Grow people inside, judge results"},{l:"Paternalistic",t:"Training + internal promotion for following rules"}],[{l:"Collaborative",t:"Subcontract experts, autonomy, judge end result"},{l:"Traditional",t:"Hire ready skills, control behaviour"}]]},
 "Fits explain <b>why</b> align; this model explains <b>how</b> to choose. Axes: <b>acquisition &amp; development</b> × <b>locus of control</b>. Bratton &amp; Gold (2014), from Bamberger &amp; Meshoulam (2000).","Commitment: tech firm with OKRs. Paternalistic: PSU bank. Collaborative: agency builds website. Traditional: fast-food recipes.");

/* ---------- A2 R&S ---------- */
card("a2","Recruitment vs selection",{type:"compare",cols:[{h:"Recruitment",items:["Attract a pool of capable applicants","Widen the net","Effective only if new hires are used & developed"]},{h:"Selection",items:["Choose the best fit from the pool","Narrow down","Person–job + person–org fit; avoid negligent hiring"]}]},

card("a3","Nine assignment types",{type:"table",head:["Type","Shape","Main problem"],rows:[["Long-term","Full move with family, 1–5 yrs","Very high cost, family, repatriation"],["Short-term","Project, 3–12 months, no family","Separation, burnout, tax"],["Inpatriate","HCN/TCN into HQ","Outsider status"],["Commuter","Lives home, travels weekly","Fatigue, tax complexity"],["Rotational","28 days on / 28 off, remote site","Isolation, safety"],["Frequent flyer","Short trips, no move","Travel stress, invisible to HR"],["Virtual","Cross-border via tech","Low trust, time zones"],["SIE","Own move, local hire","No package, underemployment, visas"],["Digital nomad","Weeks–months per country","Tax grey zones, permanent establishment risk"]]},

});

/* ===================== RENDERERS ===================== */
const esc=s=>s;
function vSteps(v){return `<div class="steps">${v.items.map((i,k)=>`<div class="step${i.win?" win":""}"><div class="n">${v.gate?"GATE ":"STEP "}${k+1}</div><div class="l">${i.l}</div>${i.t?`<div class="t">${i.t}</div>`:""}${i.f?`<div class="f">${i.f}</div>`:""}</div>`).join("")}</div>`}
function vChips(v){return `<div class="chips${v.c3?" c3":""}">${v.items.map(i=>`<div class="chip${i.hl?" hl":""}"><div class="l">${i.l}</div>${i.t?`<div class="t">${i.t}</div>`:""}</div>`).join("")}</div>`}
function vCompare(v){return `<div class="compare">${v.cols.map(c=>`<div class="col"><h4>${c.h}</h4><ul>${c.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>`}
function vMatrix(v){
  const cl=i=>`<div class="cell${i.hl?" hl":""}"><div class="l">${i.l}</div><div class="t">${i.t}</div></div>`;
  return `<div class="matrix"><div></div><div class="ax">${v.x[0]}</div><div class="ax">${v.x[1]}</div>
  <div class="ax ay">${v.y[0]}</div>${cl(v.cells[0][0])}${cl(v.cells[0][1])}
  <div class="ax ay">${v.y[1]}</div>${cl(v.cells[1][0])}${cl(v.cells[1][1])}
  ${v.xt?`<div class="cap">${v.xt}</div>`:""}</div>`}
function vPyr(v){return `<div class="pyr">${v.items.map(i=>`<div class="lv" style="width:${i.w}%">${i.l}</div>${i.r?`<div class="rt">↓ ${i.r}</div>`:""}`).join("")}</div>`}
function vLadder(v){const col={a:"var(--accent)",b:"var(--accent2)",r:"var(--bad)",g:"var(--good)",w:"var(--warn)"};
  return `<div class="ladder">${v.items.map(i=>`<div class="rung"><div class="b" style="background:${col[i.c]||col.a}">${i.l.match(/^[A-Z]?\d/)?i.l.match(/^[A-Z]?\d/)[0]:"•"}</div><div class="x"><div class="l">${i.l.replace(/^[A-Z]?\d\s*/,"")}</div><div class="t">${i.t}</div></div></div>`).join("")}</div>`}
function vBars(v){return `<div class="bars">${v.items.map(i=>`<div class="barrow"><div>${i.l}</div><div class="track"><div class="fill" style="width:${(i.v/i.max*100).toFixed(0)}%"></div><div class="val">${i.t||i.v}</div></div></div>`).join("")}</div>`}
function vTable(v){return `<div class="tbl"><table><thead><tr>${v.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function vCycle(v){
  const n=v.items.length, pos=[];
  for(let k=0;k<n;k++){const a=-Math.PI/2+2*Math.PI*k/n;pos.push([50+34*Math.cos(a),50+36*Math.sin(a)])}
  const id="ah"+Math.random().toString(36).slice(2,7);
  let arcs="";
  for(let k=0;k<n;k++){const a1=-Math.PI/2+2*Math.PI*(k+0.32)/n,a2=-Math.PI/2+2*Math.PI*(k+0.68)/n;
    const x1=50+34*Math.cos(a1),y1=50+36*Math.sin(a1),x2=50+34*Math.cos(a2),y2=50+36*Math.sin(a2);
    arcs+=`<path d="M${x1} ${y1} A34 36 0 0 1 ${x2} ${y2}" fill="none" stroke="var(--accent2)" stroke-width="0.9" marker-end="url(#${id})"/>`}
  return `<div class="cyc"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="${id}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent2)"/></marker></defs>${arcs}</svg>
  ${v.items.map((i,k)=>`<div class="node" style="left:${pos[k][0]}%;top:${pos[k][1]}%"><div class="l">${i.l}</div>${i.t?`<div class="t">${i.t}</div>`:""}</div>`).join("")}
  <div class="hub">${v.hub||""}</div></div>`}
function vCurve(v){
  const W=320,H=175,L=30,R=312,T=12,B=146;
  const X=x=>L+(R-L)*x/100, Y=y=>B-(B-T)*y/100;
  const smooth=pts=>{if(pts.length<3)return "M"+pts.map(p=>X(p[0])+" "+Y(p[1])).join(" L");
    let d=`M${X(pts[0][0])} ${Y(pts[0][1])}`;
    for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
      d+=` C${X(c1[0])} ${Y(c1[1])} ${X(c2[0])} ${Y(c2[1])} ${X(p2[0])} ${Y(p2[1])}`}return d};
  const lin=pts=>"M"+pts.map(p=>X(p[0])+" "+Y(p[1])).join(" L");
  let s=`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${v.yl} over ${v.xl}">
  <line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/><line class="axis" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/>
  <text class="axl" x="${L}" y="${B+16}">${v.xl} →</text><text class="axl" transform="translate(${L-10} ${B}) rotate(-90)">${v.yl} →</text>`;
  if(v.ymax){[0,5,10].forEach(t=>{s+=`<text class="axl" x="${L-4}" y="${Y(t/v.ymax*100)+3}" text-anchor="end">${t}</text>`})}
  if(v.vline){s+=`<line x1="${X(v.vline.x)}" y1="${T}" x2="${X(v.vline.x)}" y2="${B}" class="axis dash" style="stroke:var(--muted)"/><text class="lbl" x="${X(v.vline.x)+4}" y="${T+10}">${v.vline.t}</text>`}
  v.series.forEach(se=>{s+=`<path class="ln s-${se.c}${se.d?" dash":""}" d="${se.line?lin(se.pts):smooth(se.pts)}"/>`});
  (v.dots||[]).forEach(d=>{s+=`<circle cx="${X(d[0])}" cy="${Y(d[1])}" r="${d[2]==="m"?3.5:5}" class="d-${d[2]}"/>`});
  (v.marks||[]).forEach(m=>{const px=X(m.x),py=Y(m.y);s+=`<circle cx="${px}" cy="${py}" r="2.8" class="d-b"/><text class="lbl" x="${px+(m.dx||0)}" y="${py+(m.dy!==undefined?m.dy:-7)}" text-anchor="${m.anchor||(m.dx?"start":"middle")}">${m.t}</text>`});
  s+="</svg>";
  if(v.legend)s+=`<div class="legend">${v.legend.map(l=>`<span><i style="background:var(--${{a:"accent",b:"accent2",g:"good",r:"bad",m:"muted"}[l[0]]})"></i>${l[1]}</span>`).join("")}</div>`;
  return s}
const R={steps:vSteps,chips:vChips,compare:vCompare,matrix:vMatrix,pyramid:vPyr,ladder:vLadder,bars:vBars,table:vTable,cycle:vCycle,curve:vCurve};

const rail=document.getElementById("rail");
function modCount(id){const cs=C.filter(c=>c.m===id);return [cs.filter(c=>done.has(c.id)).length,cs.length]}
function drawRail(){

  drawRail();drawInfo();window.scrollTo({top:0,behavior:"smooth"})});
function match(c){if(!query)return true;const hay=(c.t+" "+strip(c.k)+" "+(c.eg||"")+" "+JSON.stringify(c.v)).toLowerCase();return query.split(/\s+/).every(w=>hay.includes(w))}
function drawInfo(){
  const box=document.getElementById("v-info");let h="";
  MODS.forEach(m=>{
    if(curMod!=="all"&&curMod!==m.id)return;
    const cs=C.filter(c=>c.m===m.id&&match(c));if(!cs.length)return;
    const [d,t]=modCount(m.id);
    h+=`<div class="mhead"><div><div class="tag">Part ${m.p} · ${m.s}</div><h2>${m.n}</h2></div><div class="prog"><div class="meter"><i style="width:${t?d/t*100:0}%"></i></div>${d}/${t} revised</div></div><div class="grid">`;
    cs.forEach(c=>{const isD=done.has(c.id);
      h+=`<article class="card${isD?" done":""}" data-id="${c.id}"><div class="chead"><h3>${c.t}</h3><button class="tick" data-tick="${c.id}" aria-pressed="${isD}">${isD?"✓ Revised":"Mark revised"}</button></div>
      <div class="viz">${R[c.v.type](c.v)}</div>${c.k?`<p class="kw">${c.k}</p>`:""}
      ${c.eg?`<details class="eg"><summary>Example</summary><p>${c.eg}</p></details>`:""}</article>`});
    h+="</div>"});
  box.innerHTML=h||`<div class="empty">No topics match “${query}”. Try a shorter word.</div>`}

const fcMod=document.getElementById("fc-mod"),qzMod=document.getElementById("qz-mod");
[fcMod,qzMod].forEach(s=>{s.innerHTML=`<option value="all">All modules</option>`+MODS.map(m=>`<option value="${m.id}">${m.p}: ${m.n}</option>`).join("")});
let deck=[],di=0,weakOnly=false;
const key=f=>f.m+"|"+f.term;
function buildDeck(shuffle){deck=F.filter(f=>(fcMod.value==="all"||f.m===fcMod.value)&&(!weakOnly||!known.has(key(f))));
  if(shuffle)for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  di=0;showCard()}
const flip=document.getElementById("flip");
function modName(id){return MODS.find(m=>m.id===id).n}
function showCard(){flip.classList.remove("on");
  const cnt=document.getElementById("fc-count");
  if(!deck.length){document.getElementById("fc-term").textContent=weakOnly?"Nothing left to review":"No cards";document.getElementById("fc-def").textContent="Switch off “Only cards to review” or pick another module.";document.getElementById("fc-m1").textContent="";cnt.textContent="";return}
  const f=deck[di];document.getElementById("fc-m1").textContent=modName(f.m)+" · "+f.topic;document.getElementById("fc-m2").textContent=f.term;
  document.getElementById("fc-term").textContent=f.term;document.getElementById("fc-def").textContent=f.def;
  const pool=F.filter(x=>fcMod.value==="all"||x.m===fcMod.value);
  cnt.textContent=`Card ${di+1} of ${deck.length} · ${pool.filter(x=>known.has(key(x))).length} of ${pool.length} known in this set`}
flip.addEventListener("click",()=>flip.classList.toggle("on"));
const step=d=>{if(!deck.length)return;di=(di+d+deck.length)%deck.length;showCard()};
document.getElementById("fc-next").onclick=()=>step(1);
document.getElementById("fc-prev").onclick=()=>step(-1);
document.getElementById("fc-know").onclick=()=>{if(!deck.length)return;known.add(key(deck[di]));store.set("hrm-known",[...known]);step(1)};
document.getElementById("fc-again").onclick=()=>{if(!deck.length)return;known.delete(key(deck[di]));store.set("hrm-known",[...known]);step(1)};
document.getElementById("fc-shuf").onclick=()=>buildDeck(true);
const weakBtn=document.getElementById("fc-weak");
weakBtn.onclick=()=>{weakOnly=!weakOnly;weakBtn.classList.toggle("pri",weakOnly);buildDeck()};
fcMod.onchange=()=>buildDeck();
document.addEventListener("keydown",e=>{if(mode!=="flash"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.code==="Space"){e.preventDefault();flip.classList.toggle("on")} if(e.key==="ArrowRight")step(1); if(e.key==="ArrowLeft")step(-1)});

/* ===================== QUIZ ===================== */
let Q=[],qi=0,score=0;
function startQuiz(){const pool=F.filter(f=>qzMod.value==="all"||f.m===qzMod.value);
  const n=Math.min(+document.getElementById("qz-n").value,pool.length);
  const sh=[...pool].sort(()=>Math.random()-.5).slice(0,n);
  Q=sh.map(f=>{let same=F.filter(x=>x.m===f.m&&x.term!==f.term);if(same.length<3)same=F.filter(x=>x.term!==f.term);
    const wrong=[...new Set(same.sort(()=>Math.random()-.5).map(x=>x.term))].slice(0,3);
    return {f,opts:[f.term,...wrong].sort(()=>Math.random()-.5)}});
  qi=0;score=0;drawQ()}
function drawQ(){const box=document.getElementById("qz-box");
  if(!Q.length){box.innerHTML=`<div class="qcard">Pick a module and press <b>Start new quiz</b>.</div>`;return}
  if(qi>=Q.length){const pct=Math.round(score/Q.length*100);
    box.innerHTML=`<div class="qcard qres"><div class="big">${score} / ${Q.length}</div><p>${pct>=80?"Strong. Try another module.":pct>=50?"Good base. Review the topics you missed in Flashcards.":"Revise the infographics for this module, then try again."}</p><button class="btn pri" id="qz-again">Try another set</button></div>`;
    document.getElementById("qz-again").onclick=startQuiz;return}
  const q=Q[qi];
  box.innerHTML=`<div class="qcard"><div class="qn">Question ${qi+1} of ${Q.length} · ${modName(q.f.m)}</div><div class="qq">Which term matches: <b>${q.f.def}</b>?</div>
  <div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${o.replace(/"/g,"&quot;")}">${o}</button>`).join("")}</div>
  <div class="qfoot"><span class="sc">Score ${score}</span><span id="qz-fb"></span><button class="btn pri" id="qz-next" hidden>Next</button></div></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.dataset.o===q.f.term;if(ok)score++;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===q.f.term)x.classList.add("ok")});if(!ok)b.classList.add("no");
    document.getElementById("qz-fb").textContent=ok?"Correct":"Answer: "+q.f.term+" ("+q.f.topic+")";
    box.querySelector(".sc").textContent="Score "+score;const nx=document.getElementById("qz-next");nx.hidden=false;nx.focus();nx.onclick=()=>{qi++;drawQ()}})}
document.getElementById("qz-start").onclick=startQuiz;

/* ===================== MODES ===================== */
function setMode(m){mode=m;["info","flash","quiz"].forEach(k=>{document.getElementById("v-"+k).hidden=k!==m;document.getElementById("m-"+k).setAttribute("aria-pressed",k===m)});
  if(m==="flash"){fcMod.value=curMod;buildDeck()} if(m==="quiz"){qzMod.value=curMod;if(!Q.length)startQuiz()}}
document.getElementById("m-info").onclick=()=>setMode("info");
document.getElementById("m-flash").onclick=()=>setMode("flash");
document.getElementById("m-quiz").onclick=()=>setMode("quiz");

drawRail();drawInfo();
